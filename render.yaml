services:
  - type: web
    name: edupulse-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd ../frontend && npm install && npm run build:css
    startCommand: npm start
    healthCheckPath: /api/health
    # NOTE: persistent disks require a paid Render plan (Starter or above) — the Free plan
    # cannot attach one. On Free, everything under /uploads is wiped on every deploy/restart,
    # which is why previously-uploaded images 404 after a redeploy. Uncomment this block (and
    # bump `plan` above to at least `starter`) once you're ready to make uploads durable:
    # disk:
    #   name: edupulse-uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông báo — Quantum Chat OS</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-lg lg:text-2xl font-black"><i class="fa-solid fa-bell text-amber-300 mr-2"></i>Thông báo</h2>
      </div>
      <button onclick="markAllRead()" class="text-xs text-cyan-400 hover:underline">Đánh dấu đã đọc tất cả</button>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div class="glass-panel rounded-3xl divide-y divide-white/5 max-w-2xl" id="notif-list"></div>
  </main>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  if (EduLayout.guard('social')) loadList();

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'Vừa xong';
    if (s < 3600) return Math.floor(s / 60) + ' phút trước';
    if (s < 86400) return Math.floor(s / 3600) + ' giờ trước';
    return Math.floor(s / 86400) + ' ngày trước';
  }
  function notifIcon(type) {
    return {
      like: 'fa-heart text-pink-400', comment: 'fa-comment text-cyan-400',
      reel_like: 'fa-heart text-fuchsia-400', reel_comment: 'fa-comment text-fuchsia-400',
      group_join: 'fa-people-group text-emerald-400', group_post: 'fa-note-sticky text-emerald-400'
    }[type] || 'fa-bell text-amber-300';
  }

  async function loadList() {
    const box = document.getElementById('notif-list');
    try {
      const { notifications } = await EduAPI.request('/api/notifications');
      box.innerHTML = notifications.map(n => `
        <a href="${n.link || '#'}" onclick="EduLayout.markNotifRead('${n.id}')" class="flex items-start gap-3 px-5 py-4 hover:bg-white/5 ${n.read ? 'opacity-60' : ''}">
          <i class="fa-solid ${notifIcon(n.type)} mt-1 text-lg"></i>
          <div class="min-w-0 flex-1"><p class="text-sm leading-snug">${n.message}</p><p class="text-[11px] text-slate-500 mt-1">${timeAgo(n.createdAt)}</p></div>
          ${!n.read ? '<span class="w-2.5 h-2.5 rounded-full bg-cyan-400 mt-1.5 flex-shrink-0"></span>' : ''}
        </a>`).join('') || '<p class="text-slate-500 text-sm p-6 text-center">Chưa có thông báo nào.</p>';
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
  async function markAllRead() { await EduLayout.markAllNotifsRead(); loadList(); }
</script>
</body>
</html>

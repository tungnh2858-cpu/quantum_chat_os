<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cửa Hàng Tiện Ích - EduPulse</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center gap-4 mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
      <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-store text-fuchsia-400 mr-2"></i>Cửa Hàng Tiện Ích Mở Rộng</h2>
      <button id="publish-ext-btn" onclick="openPublishModal()" class="btn-primary text-xs ml-auto hidden"><i class="fa-solid fa-plus mr-1"></i>Đăng Tiện Ích Mới</button>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div id="store-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- Publish extension modal (admin / developer only) -->
    <div id="publish-modal" class="fixed inset-0 z-[2000] bg-black/70 hidden items-center justify-center p-4">
      <div class="glass-panel p-6 rounded-3xl w-full max-w-md">
        <h3 class="font-black text-lg mb-4"><i class="fa-solid fa-code-branch mr-2"></i>Đăng Tiện Ích Mới (Developer)</h3>
        <form id="publish-form" class="space-y-3">
          <input required id="e-id" class="input-field font-mono" placeholder="Mã định danh (VD: ext-my-tool)">
          <input required id="e-name" class="input-field" placeholder="Tên tiện ích">
          <textarea id="e-desc" class="input-field" placeholder="Mô tả"></textarea>
          <input id="e-icon" class="input-field" placeholder="Icon Font Awesome (VD: fa-wand-magic-sparkles)">
          <input id="e-category" class="input-field" placeholder="Danh mục (VD: AI, Lập trình...)">
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closePublishModal()" class="flex-1 py-2.5 rounded-xl bg-white/5 font-bold text-sm">Huỷ</button>
            <button type="submit" class="flex-1 py-2.5 btn-primary text-sm">Đăng Tiện Ích</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  if (EduLayout.guard('store')) {
    loadStore();
    if (['admin', 'developer'].includes(EduAPI.getUser().role)) document.getElementById('publish-ext-btn').classList.remove('hidden');
  }

  async function loadStore() {
    const { items } = await EduAPI.request('/api/store');
    const me = EduAPI.getUser();
    document.getElementById('store-grid').innerHTML = items.map(i => `
      <div class="glass-panel p-5 rounded-3xl">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-12 h-12 rounded-2xl bg-fuchsia-500/10 flex items-center justify-center text-fuchsia-400"><i class="fa-solid ${i.icon} text-lg"></i></div>
          <div class="flex-1 min-w-0"><p class="font-black truncate">${i.name}</p><p class="text-[10px] text-slate-500 uppercase font-bold">${i.category}</p></div>
          ${(i.publishedBy && (i.publishedBy === me.id || me.role === 'admin')) ? `<button onclick="deleteExtension('${i.id}')" class="text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
        <p class="text-xs text-slate-400 mb-4">${i.description}</p>
        <button onclick="toggleInstall('${i.id}', ${i.installedByMe})" class="${i.installedByMe ? 'btn-danger' : 'btn-primary'} text-xs w-full">
          ${i.installedByMe ? '<i class="fa-solid fa-trash mr-1"></i>Gỡ Cài Đặt' : '<i class="fa-solid fa-download mr-1"></i>Cài Đặt'}
        </button>
      </div>`).join('');
  }

  async function toggleInstall(id, installed) {
    await EduAPI.request(`/api/store/${id}/${installed ? 'uninstall' : 'install'}`, { method: 'POST' });
    loadStore();
  }

  function openPublishModal() { document.getElementById('publish-modal').classList.remove('hidden'); document.getElementById('publish-modal').classList.add('flex'); }
  function closePublishModal() { document.getElementById('publish-modal').classList.add('hidden'); document.getElementById('publish-modal').classList.remove('flex'); }

  document.getElementById('publish-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await EduAPI.request('/api/store', { method: 'POST', body: {
        id: document.getElementById('e-id').value.trim(),
        name: document.getElementById('e-name').value.trim(),
        description: document.getElementById('e-desc').value.trim(),
        icon: document.getElementById('e-icon').value.trim() || undefined,
        category: document.getElementById('e-category').value.trim() || undefined
      }});
      EduAPI.toast('Đã đăng tiện ích mới.', 'success');
      closePublishModal(); e.target.reset(); loadStore();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  });

  async function deleteExtension(id) {
    if (!confirm('Xoá tiện ích này khỏi cửa hàng?')) return;
    try { await EduAPI.request(`/api/store/${id}`, { method: 'DELETE' }); loadStore(); }
    catch (err) { EduAPI.toast(err.message, 'error'); }
  }
</script>
</body>
</html>

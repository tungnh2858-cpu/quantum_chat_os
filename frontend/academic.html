<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trường & Lớp Học - EduPulse</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-school text-cyan-400 mr-2"></i>Trường & Lớp Học</h2>
      </div>
      <div class="flex gap-2">
        <button onclick="openSchoolModal()" class="btn-primary text-xs"><i class="fa-solid fa-plus mr-1"></i>Tạo Trường</button>
        <button onclick="openClassModal()" class="btn-primary text-xs"><i class="fa-solid fa-plus mr-1"></i>Tạo Lớp</button>
      </div>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <h3 class="font-black mb-3 text-slate-300 text-sm uppercase tracking-widest">Danh sách trường</h3>
    <div id="schools-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8"></div>

    <h3 class="font-black mb-3 text-slate-300 text-sm uppercase tracking-widest">Danh sách lớp học</h3>
    <div id="classes-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </main>
</div>

<!-- School modal -->
<div id="school-modal" class="fixed inset-0 z-[2000] bg-black/60 hidden items-center justify-center p-4">
  <div class="glass-panel p-6 rounded-3xl w-full max-w-md">
    <h3 class="font-black text-lg mb-4"><i class="fa-solid fa-school mr-2"></i>Tạo Trường Mới</h3>
    <form id="school-form" class="space-y-3">
      <div class="flex items-center gap-3">
        <img id="logo-preview" class="w-16 h-16 rounded-2xl object-cover bg-white/5" src="">
        <input type="file" id="s-logo" accept="image/*" onchange="previewLogo(this)">
      </div>
      <input required id="s-name" class="input-field" placeholder="Tên trường">
      <input id="s-address" class="input-field" placeholder="Địa chỉ">
      <textarea id="s-desc" class="input-field" placeholder="Mô tả"></textarea>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeModal('school-modal')" class="flex-1 py-2.5 rounded-xl bg-white/5 font-bold text-sm">Huỷ</button>
        <button type="submit" class="flex-1 py-2.5 btn-primary text-sm">Tạo Trường</button>
      </div>
    </form>
  </div>
</div>

<!-- Class modal -->
<div id="class-modal" class="fixed inset-0 z-[2000] bg-black/60 hidden items-center justify-center p-4">
  <div class="glass-panel p-6 rounded-3xl w-full max-w-md">
    <h3 class="font-black text-lg mb-4"><i class="fa-solid fa-layer-group mr-2"></i>Tạo Lớp Học</h3>
    <form id="class-form" class="space-y-3">
      <input required id="cl-name" class="input-field" placeholder="Tên lớp (VD: 10A1 - Lập trình Web)">
      <input id="cl-subject" class="input-field" placeholder="Môn học / chuyên đề">
      <select id="cl-school" class="input-field"><option value="">-- Không thuộc trường nào --</option></select>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeModal('class-modal')" class="flex-1 py-2.5 rounded-xl bg-white/5 font-bold text-sm">Huỷ</button>
        <button type="submit" class="flex-1 py-2.5 btn-primary text-sm">Tạo Lớp</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  if (EduLayout.guard('academic', { staffOnly: true })) { loadSchools(); loadClasses(); }
  EduAPI.enableFancyFileInput('s-logo', 'Chọn Ảnh Logo');

  function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
  function openSchoolModal() { openModal('school-modal'); }
  function openClassModal() { openModal('class-modal'); }
  function previewLogo(input) {
    if (input.files[0]) document.getElementById('logo-preview').src = URL.createObjectURL(input.files[0]);
  }

  async function loadSchools() {
    const { schools } = await EduAPI.request('/api/schools');
    document.getElementById('schools-grid').innerHTML = schools.map(s => `
      <div class="glass-panel p-5 rounded-3xl flex gap-4 items-center">
        <div class="w-14 h-14 rounded-2xl bg-white/5 overflow-hidden flex items-center justify-center">
          ${s.logo ? `<img src="${EduAPI.fileUrl(s.logo)}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-school text-cyan-400 text-xl"></i>'}
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-black truncate">${s.name}</p>
          <p class="text-xs text-slate-400 truncate">${s.address || 'Chưa có địa chỉ'}</p>
        </div>
      </div>`).join('') || '<p class="text-slate-500 text-sm">Chưa có trường nào.</p>';

    const sel = document.getElementById('cl-school');
    sel.innerHTML = '<option value="">-- Không thuộc trường nào --</option>' + schools.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  }

  async function loadClasses() {
    const { classes } = await EduAPI.request('/api/classes');
    document.getElementById('classes-grid').innerHTML = classes.map(c => `
      <div class="glass-panel p-5 rounded-3xl">
        <div class="flex items-center justify-between">
          <p class="font-black">${c.name}</p>
          <button onclick="deleteClass('${c.id}')" class="text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
        </div>
        <p class="text-xs text-slate-400 mt-1">${c.subject || 'Chưa có môn học'}</p>
        <p class="text-[10px] text-slate-500 mt-2"><i class="fa-solid fa-user-graduate mr-1"></i>${c.studentIds.length} học sinh</p>
      </div>`).join('') || '<p class="text-slate-500 text-sm">Chưa có lớp học nào.</p>';
  }

  async function deleteClass(id) {
    if (!confirm('Xoá lớp học này?')) return;
    await EduAPI.request(`/api/classes/${id}`, { method: 'DELETE' });
    loadClasses();
  }

  document.getElementById('school-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData();
    fd.append('name', document.getElementById('s-name').value);
    fd.append('address', document.getElementById('s-address').value);
    fd.append('description', document.getElementById('s-desc').value);
    const file = document.getElementById('s-logo').files[0];
    if (file) fd.append('logo', file);
    try {
      await EduAPI.request('/api/schools', { method: 'POST', body: fd, isForm: true });
      EduAPI.toast('Đã tạo trường mới.', 'success');
      closeModal('school-modal'); e.target.reset(); loadSchools();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  });

  document.getElementById('class-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await EduAPI.request('/api/classes', { method: 'POST', body: {
        name: document.getElementById('cl-name').value,
        subject: document.getElementById('cl-subject').value,
        schoolId: document.getElementById('cl-school').value || null
      }});
      EduAPI.toast('Đã tạo lớp học.', 'success');
      closeModal('class-modal'); e.target.reset(); loadClasses();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  });
</script>
</body>
</html>

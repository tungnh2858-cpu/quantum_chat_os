<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cài Đặt Tài Khoản - Quantum Chat OS</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<link rel="icon" type="image/svg+xml" href="assets/img/quantum-chat-logo.svg"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center gap-4 mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
      <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-gear text-slate-400 mr-2"></i>Cài Đặt Tài Khoản</h2>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="glass-panel p-6 rounded-3xl">
        <h3 class="font-black mb-4"><i class="fa-solid fa-id-badge mr-2 text-cyan-400"></i>Hồ Sơ Cá Nhân</h3>
        <div class="flex items-center gap-4 mb-4">
          <img id="avatar-preview" class="w-16 h-16 rounded-2xl object-cover bg-white/5">
          <input type="file" id="avatar-input" accept="image/*" onchange="uploadAvatar(this)">
        </div>
        <form id="profile-form" class="space-y-3">
          <input id="s-fullname" class="input-field" placeholder="Họ và tên">
          <input id="s-email" type="email" class="input-field" placeholder="Email">
          <textarea id="s-bio" class="input-field" placeholder="Giới thiệu bản thân"></textarea>
          <button type="submit" class="btn-primary text-sm w-full">Lưu Hồ Sơ</button>
        </form>
      </div>

      <div class="glass-panel p-6 rounded-3xl">
        <h3 class="font-black mb-4"><i class="fa-solid fa-shield-halved mr-2 text-rose-400"></i>Bảo Mật</h3>
        <form id="password-form" class="space-y-3">
          <input id="s-current-pw" type="password" class="input-field" placeholder="Mật khẩu hiện tại">
          <input id="s-new-pw" type="password" class="input-field" placeholder="Mật khẩu mới (>=6 ký tự)">
          <button type="submit" class="btn-primary text-sm w-full">Đổi Mật Khẩu</button>
        </form>
      </div>

      <div class="glass-panel p-6 rounded-3xl">
        <h3 class="font-black mb-4"><i class="fa-solid fa-palette mr-2 text-amber-400"></i>Giao Diện</h3>
        <div class="flex gap-2">
          <button onclick="setTheme('dark')" class="flex-1 py-2.5 rounded-xl bg-white/5 font-bold text-sm">Tối (Dark)</button>
          <button onclick="setTheme('light')" class="flex-1 py-2.5 rounded-xl bg-white/5 font-bold text-sm">Sáng (Light)</button>
        </div>
      </div>

      <div class="glass-panel p-6 rounded-3xl">
        <h3 class="font-black mb-4"><i class="fa-solid fa-bell mr-2 text-emerald-400"></i>Thông Báo</h3>
        <label class="flex items-center justify-between py-2 text-sm"><span>Email</span><input type="checkbox" id="notif-email" onchange="saveNotif()"></label>
        <label class="flex items-center justify-between py-2 text-sm"><span>Đẩy (Push)</span><input type="checkbox" id="notif-push" onchange="saveNotif()"></label>
        <label class="flex items-center justify-between py-2 text-sm"><span>Trò chuyện</span><input type="checkbox" id="notif-chat" onchange="saveNotif()"></label>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  if (EduLayout.guard('settings')) { fillForm(); }
  EduAPI.enablePasswordToggle('s-current-pw');
  EduAPI.enablePasswordToggle('s-new-pw');
  EduAPI.enableFancyFileInput('avatar-input', 'Chọn Ảnh Đại Diện');

  function fillForm() {
    const u = EduAPI.getUser();
    document.getElementById('s-fullname').value = u.fullName || '';
    document.getElementById('s-email').value = u.email || '';
    document.getElementById('s-bio').value = u.bio || '';
    document.getElementById('avatar-preview').src = u.avatar ? EduAPI.fileUrl(u.avatar) : '';
    document.getElementById('notif-email').checked = !!(u.notifications && u.notifications.email);
    document.getElementById('notif-push').checked = !!(u.notifications && u.notifications.push);
    document.getElementById('notif-chat').checked = !!(u.notifications && u.notifications.chat);
  }

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const { user } = await EduAPI.request('/api/users/me/profile', { method: 'PUT', body: {
        fullName: document.getElementById('s-fullname').value,
        email: document.getElementById('s-email').value,
        bio: document.getElementById('s-bio').value
      }});
      EduAPI.setUser(user);
      EduAPI.toast('Đã lưu hồ sơ.', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await EduAPI.request('/api/auth/password', { method: 'PUT', body: {
        currentPassword: document.getElementById('s-current-pw').value,
        newPassword: document.getElementById('s-new-pw').value
      }});
      EduAPI.toast('Đã đổi mật khẩu.', 'success');
      e.target.reset();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  });

  async function uploadAvatar(input) {
    const file = input.files[0]; if (!file) return;
    const fd = new FormData(); fd.append('avatar', file);
    try {
      const { user } = await EduAPI.request('/api/users/me/avatar', { method: 'POST', body: fd, isForm: true });
      EduAPI.setUser(user);
      document.getElementById('avatar-preview').src = EduAPI.fileUrl(user.avatar);
      EduAPI.toast('Đã cập nhật ảnh đại diện.', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  async function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try {
      const { user } = await EduAPI.request('/api/users/me/preferences', { method: 'PUT', body: { theme } });
      EduAPI.setUser(user);
    } catch (err) { EduAPI.toast(err.message, 'error'); return; }
    EduAPI.toast(`Đã chuyển giao diện ${theme === 'dark' ? 'Tối' : 'Sáng'}.`, 'success');
  }

  async function saveNotif() {
    const notifications = {
      email: document.getElementById('notif-email').checked,
      push: document.getElementById('notif-push').checked,
      chat: document.getElementById('notif-chat').checked
    };
    const { user } = await EduAPI.request('/api/users/me/preferences', { method: 'PUT', body: { notifications } });
    EduAPI.setUser(user);
    EduAPI.toast('Đã lưu tuỳ chọn thông báo.', 'success');
  }
</script>
</body>
</html>

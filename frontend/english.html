<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tiếng Anh - EduPulse</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-language text-sky-400 mr-2"></i>Học Tiếng Anh</h2>
      </div>
      <button id="add-lesson-btn" onclick="openLessonModal()" class="btn-primary text-xs hidden"><i class="fa-solid fa-plus mr-1"></i>Thêm Bài Học</button>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div id="lessons-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>
</div>

<div id="flash-modal" class="fixed inset-0 z-[2000] bg-black/70 hidden items-center justify-center p-4">
  <div class="glass-panel p-8 rounded-3xl w-full max-w-md text-center">
    <p class="text-xs text-slate-400 mb-2" id="flash-progress">1 / 1</p>
    <div class="min-h-[120px] flex items-center justify-center cursor-pointer" onclick="flipCard()">
      <h2 id="flash-front" class="text-3xl font-black"></h2>
    </div>
    <div class="flex justify-center gap-3 mt-6">
      <button onclick="prevCard()" class="px-4 py-2 rounded-xl bg-white/5 font-bold text-sm"><i class="fa-solid fa-arrow-left"></i></button>
      <button onclick="flipCard()" class="px-4 py-2 rounded-xl bg-white/5 font-bold text-sm">Lật thẻ</button>
      <button onclick="nextCard()" class="px-4 py-2 rounded-xl bg-white/5 font-bold text-sm"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <button onclick="closeFlash()" class="mt-4 text-xs text-slate-500">Đóng</button>
  </div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  let lessons = [], cur = null, idx = 0, flipped = false;
  if (EduLayout.guard('english')) {
    load();
    if (['admin', 'teacher'].includes(EduAPI.getUser().role)) document.getElementById('add-lesson-btn').classList.remove('hidden');
  }

  async function load() {
    const { lessons: l } = await EduAPI.request('/api/english/lessons');
    lessons = l;
    document.getElementById('lessons-grid').innerHTML = lessons.map(les => `
      <div class="glass-panel p-5 rounded-3xl flex items-center justify-between">
        <div>
          <p class="font-black">${les.title}</p>
          <p class="text-xs text-slate-400">Trình độ ${les.level} • ${les.words.length} từ vựng</p>
        </div>
        <button onclick='startFlash(${JSON.stringify(les.id)})' class="btn-primary text-xs">Học Ngay</button>
      </div>`).join('');
  }

  function startFlash(id) {
    cur = lessons.find(l => l.id === id); idx = 0; flipped = false;
    document.getElementById('flash-modal').classList.remove('hidden');
    document.getElementById('flash-modal').classList.add('flex');
    renderCard();
  }
  function closeFlash() { document.getElementById('flash-modal').classList.add('hidden'); document.getElementById('flash-modal').classList.remove('flex'); }
  function renderCard() {
    const w = cur.words[idx];
    document.getElementById('flash-front').textContent = flipped ? w.meaning : w.word;
    document.getElementById('flash-progress').textContent = `${idx + 1} / ${cur.words.length}`;
  }
  function flipCard() { flipped = !flipped; renderCard(); }
  function nextCard() { flipped = false; idx = (idx + 1) % cur.words.length; renderCard(); }
  function prevCard() { flipped = false; idx = (idx - 1 + cur.words.length) % cur.words.length; renderCard(); }

  function openLessonModal() {
    const title = prompt('Tên bài học:'); if (!title) return;
    const level = prompt('Trình độ (A1/A2/B1/B2...):', 'A1') || 'A1';
    const raw = prompt('Danh sách từ vựng, mỗi dòng theo dạng "word = nghĩa":', 'Example = Ví dụ');
    if (!raw) return;
    const words = raw.split('\n').map(line => {
      const [word, meaning] = line.split('=').map(s => s.trim());
      return { word, meaning: meaning || '' };
    }).filter(w => w.word);
    EduAPI.request('/api/english/lessons', { method: 'POST', body: { title, level, words } })
      .then(() => { EduAPI.toast('Đã thêm bài học.', 'success'); load(); })
      .catch(err => EduAPI.toast(err.message, 'error'));
  }
</script>
</body>
</html>

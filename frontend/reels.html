<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Chat OS — Reels</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
<style>
  .reels-scroller{scroll-snap-type:y mandatory;overflow-y:auto;height:100%}
  .reel-slide{scroll-snap-align:start;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:#000;border-radius:1.5rem;overflow:hidden}
  .reel-slide video{width:100%;height:100%;object-fit:contain;background:#000}
  .reel-side-actions{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5}
  .reel-side-actions button{color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
  .reel-side-actions i{font-size:1.6rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
  .reel-meta{position:absolute;left:16px;right:80px;bottom:24px;color:#fff;z-index:5}
  .reel-meta p{text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:1rem}
  .reel-upload-fab{position:fixed;bottom:28px;right:28px;z-index:900}
</style>
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-hidden p-4 lg:p-6">
    <header class="flex items-center justify-between mb-4 glass-panel p-4 rounded-3xl shadow-xl flex-shrink-0">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-lg lg:text-2xl font-black"><i class="fa-solid fa-clapperboard text-fuchsia-400 mr-2"></i>Reels</h2>
      </div>
      <button onclick="openModal('reel-compose-modal')" class="btn-primary text-xs"><i class="fa-solid fa-plus mr-1"></i>Tạo Reel</button>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div class="flex-1 flex justify-center overflow-hidden">
      <div id="reels-scroller" class="reels-scroller w-full max-w-md rounded-3xl"></div>
    </div>
  </main>
</div>

<!-- Compose modal -->
<div id="reel-compose-modal" class="modal-backdrop hidden">
  <div class="glass-panel rounded-3xl p-5 w-full max-w-sm">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-sm"><i class="fa-solid fa-clapperboard text-fuchsia-400 mr-1"></i>Tạo Reel mới</h3>
      <button onclick="closeModal('reel-compose-modal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <video id="reel-preview-video" class="w-full h-64 object-cover rounded-2xl mb-3 hidden bg-black" controls></video>
    <label class="file-field-btn cursor-pointer text-xs w-full flex items-center justify-center gap-2 mb-3">
      <i class="fa-solid fa-upload"></i> Chọn video ngắn
      <input type="file" id="reel-video-input" accept="video/*" class="hidden">
    </label>
    <input id="reel-caption" class="input-field text-xs mb-3" placeholder="Chú thích (không bắt buộc)">
    <button onclick="submitReel()" class="btn-primary w-full text-xs">Đăng Reel</button>
  </div>
</div>

<!-- Comments modal -->
<div id="reel-comments-modal" class="modal-backdrop hidden">
  <div class="glass-panel rounded-3xl p-5 w-full max-w-sm max-h-[80vh] flex flex-col">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-sm"><i class="fa-solid fa-comment text-cyan-400 mr-1"></i>Bình luận</h3>
      <button onclick="closeModal('reel-comments-modal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="reel-comments-list" class="flex-1 overflow-y-auto space-y-2 text-xs mb-3"></div>
    <div class="flex gap-2">
      <input id="reel-comment-input" class="input-field text-xs" placeholder="Viết bình luận...">
      <button onclick="submitReelComment()" class="btn-primary text-xs px-3"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  let reels = [], reelFile = null, activeReelId = null;

  if (EduLayout.guard('reels')) loadReels();

  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function avatarHtml(u, size = 8) {
    const initials = (u.fullName || u.username || '?').trim().split(/\s+/).slice(-2).map(s => s[0]).join('').toUpperCase();
    return u.avatar ? `<img src="${EduAPI.fileUrl(u.avatar)}" class="w-${size} h-${size} rounded-full object-cover border-2 border-white/40">` : `<div class="avatar-initial w-${size} h-${size} text-xs">${initials}</div>`;
  }

  async function loadReels() {
    const { reels: list } = await EduAPI.request('/api/reels');
    reels = list;
    const me = EduAPI.getUser();
    const box = document.getElementById('reels-scroller');
    if (!reels.length) {
      box.innerHTML = '<div class="glass-panel rounded-3xl h-full flex items-center justify-center p-6 text-center text-slate-500 text-sm">Chưa có Reel nào. Hãy là người đầu tiên đăng video ngắn!</div>';
      return;
    }
    box.innerHTML = reels.map(r => {
      const liked = r.likes.includes(me.id);
      return `
      <div class="reel-slide" data-id="${r.id}">
        <video src="${EduAPI.fileUrl(r.video)}" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
        <div class="reel-meta">
          <div class="flex items-center gap-2 mb-1">
            ${r.author ? avatarHtml(r.author) : ''}
            <a href="profile.html?id=${r.author ? r.author.id : ''}" class="font-black text-sm hover:underline">${r.author ? (r.author.fullName || r.author.username) : 'Ẩn danh'}</a>
          </div>
          <p class="text-xs whitespace-pre-wrap">${escapeHtml(r.caption)}</p>
        </div>
        <div class="reel-side-actions">
          <button onclick="likeReel('${r.id}')"><i class="fa-solid fa-heart ${liked ? 'text-pink-500' : ''}"></i><span>${r.likeCount}</span></button>
          <button onclick="openComments('${r.id}')"><i class="fa-solid fa-comment"></i><span>${r.commentCount}</span></button>
          ${(r.author && r.author.id === me.id) || me.role === 'admin' ? `<button onclick="deleteReel('${r.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
      </div>`;
    }).join('');

    // Autoplay whichever slide is in view; pause the rest (TikTok/Reels-style behaviour).
    const slides = box.querySelectorAll('.reel-slide');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (entry.isIntersecting) {
          video.play().catch(() => {});
          EduAPI.request(`/api/reels/${entry.target.dataset.id}/view`, { method: 'POST' }).catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { root: box, threshold: 0.6 });
    slides.forEach(s => observer.observe(s));
  }

  async function likeReel(id) { await EduAPI.request(`/api/reels/${id}/like`, { method: 'POST' }); loadReels(); }
  async function deleteReel(id) { if (!confirm('Xoá Reel này?')) return; await EduAPI.request(`/api/reels/${id}`, { method: 'DELETE' }); loadReels(); }

  function openComments(id) {
    activeReelId = id;
    renderComments();
    openModal('reel-comments-modal');
  }
  function renderComments() {
    const reel = reels.find(r => r.id === activeReelId);
    const me = EduAPI.getUser();
    document.getElementById('reel-comments-list').innerHTML = (reel.comments || []).map(c => `<p><b>${c.authorId === me.id ? 'Bạn' : 'User'}:</b> ${escapeHtml(c.content)}</p>`).join('') || '<p class="text-slate-500">Chưa có bình luận nào.</p>';
  }
  async function submitReelComment() {
    const input = document.getElementById('reel-comment-input');
    const content = input.value.trim(); if (!content) return;
    try {
      const { reel } = await EduAPI.request(`/api/reels/${activeReelId}/comments`, { method: 'POST', body: { content } });
      reels = reels.map(r => r.id === reel.id ? reel : r);
      input.value = '';
      renderComments();
      loadReels();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  document.getElementById('reel-video-input').addEventListener('change', e => {
    reelFile = e.target.files[0] || null;
    const v = document.getElementById('reel-preview-video');
    if (reelFile) { v.src = URL.createObjectURL(reelFile); v.classList.remove('hidden'); }
  });
  async function submitReel() {
    if (!reelFile) { EduAPI.toast('Hãy chọn một video ngắn.', 'error'); return; }
    const fd = new FormData();
    fd.append('video', reelFile);
    fd.append('caption', document.getElementById('reel-caption').value.trim());
    try {
      await EduAPI.request('/api/reels', { method: 'POST', body: fd, isForm: true });
      reelFile = null;
      document.getElementById('reel-video-input').value = '';
      document.getElementById('reel-caption').value = '';
      document.getElementById('reel-preview-video').classList.add('hidden');
      closeModal('reel-compose-modal');
      loadReels();
      EduAPI.toast('Đã đăng Reel!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dự Án & Website - EduPulse</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-globe text-indigo-400 mr-2"></i>Dự Án & Website</h2>
      </div>
      <button onclick="openNewProject()" class="btn-primary text-xs"><i class="fa-solid fa-plus mr-1"></i>Dự Án Mới</button>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </main>
</div>

<!-- Editor modal -->
<div id="editor-modal" class="fixed inset-0 z-[2000] bg-black/70 hidden items-center justify-center p-4">
  <div class="glass-panel p-6 rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
    <h3 class="font-black text-lg mb-4"><i class="fa-solid fa-code mr-2"></i>Trình Soạn Thảo Dự Án</h3>
    <input id="p-name" class="input-field mb-2" placeholder="Tên dự án">
    <input id="p-desc" class="input-field mb-2" placeholder="Mô tả ngắn">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-2">
      <div><label class="text-[10px] text-slate-400 uppercase font-bold">HTML</label><textarea id="p-html" class="input-field font-mono text-xs" rows="10"></textarea></div>
      <div><label class="text-[10px] text-slate-400 uppercase font-bold">CSS</label><textarea id="p-css" class="input-field font-mono text-xs" rows="10"></textarea></div>
      <div><label class="text-[10px] text-slate-400 uppercase font-bold">JavaScript</label><textarea id="p-js" class="input-field font-mono text-xs" rows="10"></textarea></div>
    </div>
    <label class="flex items-center gap-2 text-xs mb-4"><input type="checkbox" id="p-published"> Công khai dự án (tạo đường dẫn https dạng /p/ten-du-an)</label>
    <div class="flex gap-2">
      <button onclick="closeEditor()" class="flex-1 py-2.5 rounded-xl bg-white/5 font-bold text-sm">Đóng</button>
      <button onclick="saveProject()" class="flex-1 py-2.5 btn-primary text-sm">Lưu Dự Án</button>
    </div>
  </div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  let editingId = null;
  if (EduLayout.guard('projects')) { loadProjects(); }

  async function loadProjects() {
    const { projects } = await EduAPI.request('/api/projects?mine=1');
    document.getElementById('projects-grid').innerHTML = projects.map(p => `
      <div class="glass-panel p-5 rounded-3xl">
        <div class="flex items-center justify-between mb-2">
          <p class="font-black truncate">${p.name}</p>
          <span class="text-[10px] px-2 py-1 rounded font-bold uppercase ${p.published ? 'bg-emerald-500/10 text-emerald-400' : 'bg-slate-500/10 text-slate-400'}">${p.published ? 'Đã công khai' : 'Bản nháp'}</span>
        </div>
        <p class="text-xs text-slate-400 mb-3 truncate">${p.description || 'Không có mô tả'}</p>
        <div class="flex gap-2 text-xs">
          <button onclick="editProject('${p.id}')" class="flex-1 py-2 rounded-xl bg-white/5 font-bold"><i class="fa-solid fa-pen mr-1"></i>Sửa</button>
          ${p.published ? `<a href="/p/${p.slug}" target="_blank" class="flex-1 py-2 rounded-xl bg-cyan-500/10 text-cyan-400 font-bold text-center"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Xem</a>` : ''}
          <button onclick="deleteProject('${p.id}')" class="py-2 px-3 rounded-xl bg-rose-500/10 text-rose-400 font-bold"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>`).join('') || '<p class="text-slate-500 text-sm">Chưa có dự án nào. Hãy tạo dự án đầu tiên!</p>';
  }

  function openNewProject() {
    editingId = null;
    document.getElementById('p-name').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-html').value = '<h1>Xin chào, đây là dự án của tôi!</h1>';
    document.getElementById('p-css').value = 'body{font-family:sans-serif;text-align:center;margin-top:60px;}';
    document.getElementById('p-js').value = '';
    document.getElementById('p-published').checked = false;
    openEditor();
  }

  async function editProject(id) {
    const { project } = await EduAPI.request(`/api/projects/${id}`);
    editingId = id;
    document.getElementById('p-name').value = project.name;
    document.getElementById('p-desc').value = project.description;
    document.getElementById('p-html').value = project.html;
    document.getElementById('p-css').value = project.css;
    document.getElementById('p-js').value = project.js;
    document.getElementById('p-published').checked = project.published;
    openEditor();
  }

  function openEditor() { document.getElementById('editor-modal').classList.remove('hidden'); document.getElementById('editor-modal').classList.add('flex'); }
  function closeEditor() { document.getElementById('editor-modal').classList.add('hidden'); document.getElementById('editor-modal').classList.remove('flex'); }

  async function saveProject() {
    const body = {
      name: document.getElementById('p-name').value.trim(),
      description: document.getElementById('p-desc').value.trim(),
      html: document.getElementById('p-html').value,
      css: document.getElementById('p-css').value,
      js: document.getElementById('p-js').value,
      published: document.getElementById('p-published').checked
    };
    if (!body.name) return EduAPI.toast('Vui lòng nhập tên dự án.', 'error');
    try {
      if (editingId) await EduAPI.request(`/api/projects/${editingId}`, { method: 'PUT', body });
      else await EduAPI.request('/api/projects', { method: 'POST', body });
      EduAPI.toast('Đã lưu dự án.', 'success');
      closeEditor(); loadProjects();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  async function deleteProject(id) {
    if (!confirm('Xoá dự án này?')) return;
    await EduAPI.request(`/api/projects/${id}`, { method: 'DELETE' });
    loadProjects();
  }
</script>
</body>
</html>

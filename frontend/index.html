<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quantum Chat OS — Đăng Nhập</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06040d">
<link rel="icon" type="image/svg+xml" href="assets/img/quantum-chat-logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {
    colors: { brand: { 50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d' },
      cyber: { glowGreen:'#10b981', glowBlue:'#00f0ff', glowPink:'#ff007f' } },
    fontFamily: { sans: ['Plus Jakarta Sans','Inter','sans-serif'], mono: ['Space Grotesk','monospace'] }
  }}};
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">

<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="glowing-bg-circle bg-brand-600 w-[500px] h-[500px] -top-24 -left-24"></div>
<div class="glowing-bg-circle bg-cyan-500 w-[400px] h-[400px] bottom-10 right-10"></div>

<div id="login-overlay" class="fixed inset-0 z-[1000] flex items-center justify-center p-4">
  <div class="glass-panel p-8 rounded-3xl w-full max-w-md shadow-2xl border border-white/10 relative z-10">
    <div class="text-center mb-8">
      <img src="assets/img/quantum-chat-logo.svg" class="w-16 h-16 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(139,92,246,0.7)]">
      <h1 class="text-2xl font-black text-white tracking-tight">Quantum Chat OS</h1>
      <p class="text-xs text-slate-400 mt-2">Kết nối, chia sẻ và trò chuyện cùng bạn bè</p>
    </div>

    <div class="flex gap-2 mb-6 bg-white/5 p-1 rounded-2xl">
      <button id="mode-login-btn" onclick="setMode('login')" class="flex-1 py-2 rounded-xl text-xs font-bold">Đăng Nhập</button>
      <button id="mode-register-btn" onclick="setMode('register')" class="flex-1 py-2 rounded-xl text-xs font-bold">Đăng Ký</button>
    </div>

    <!-- LOGIN -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tài khoản hoặc Email</label>
        <input type="text" id="login-username" required class="input-field font-mono" placeholder="Tên đăng nhập hoặc email...">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mật khẩu</label>
        <input type="password" id="login-password" required class="input-field" placeholder="Nhập mật khẩu...">
      </div>
      <div id="captcha-row">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1"><i class="fa-solid fa-robot mr-1"></i>Xác minh bạn không phải Bot</label>
        <div class="flex items-center gap-2">
          <span id="captcha-question" class="input-field w-24 text-center font-mono select-none">...</span>
          <input type="number" id="captcha-answer" class="input-field" placeholder="Nhập kết quả">
          <button type="button" onclick="loadCaptcha()" class="w-11 h-11 shrink-0 rounded-xl bg-white/5 hover:bg-white/10 text-cyan-400" title="Đổi câu hỏi khác"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>
      <button type="submit" id="login-btn" class="w-full py-3.5 mt-2 btn-primary flex justify-center items-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
      </button>
    </form>

    <!-- REGISTER (email + phone required for verification, like Facebook sign-up) -->
    <form id="register-form" class="space-y-3 hidden">
      <input type="text" id="reg-fullname" required class="input-field" placeholder="Họ và tên">
      <input type="text" id="reg-username" required class="input-field font-mono" placeholder="Tên đăng nhập">
      <input type="email" id="reg-email" required class="input-field" placeholder="Email (bắt buộc để xác minh)">
      <input type="tel" id="reg-phone" required class="input-field" placeholder="Số điện thoại (bắt buộc để xác minh)">
      <input type="password" id="reg-password" required class="input-field" placeholder="Mật khẩu (tối thiểu 6 ký tự)">
      <button type="submit" id="register-btn" class="w-full py-3.5 mt-2 btn-primary flex justify-center items-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Tạo Tài Khoản
      </button>
      <p class="text-[10px] text-slate-500 text-center">Bằng việc đăng ký, bạn xác nhận email và số điện thoại thuộc về bạn.</p>
    </form>

    <!-- OTP -->
    <form id="otp-form" class="space-y-4 hidden">
      <div class="text-center">
        <i class="fa-solid fa-envelope-open-text text-cyan-400 text-3xl mb-2"></i>
        <p id="otp-message" class="text-xs text-slate-400"></p>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mã xác nhận (6 số)</label>
        <input type="text" id="otp-code" required maxlength="6" class="input-field font-mono text-center text-xl tracking-[0.5em]" placeholder="------">
      </div>
      <button type="submit" id="otp-btn" class="w-full py-3.5 btn-primary flex justify-center items-center gap-2">
        <i class="fa-solid fa-shield-check"></i> Xác Nhận Đăng Nhập
      </button>
      <button type="button" onclick="cancelOtp()" class="w-full py-2 text-xs text-slate-500 hover:text-slate-300">← Quay lại đăng nhập</button>
    </form>

    <div class="mt-6 text-center border-t border-white/10 pt-4">
      <p class="text-[10px] text-slate-500">Backend API: <span id="api-base-display" class="font-mono"></span></p>
    </div>
  </div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script>
  document.getElementById('api-base-display').textContent = EduAPI.API_BASE;
  EduAPI.enablePasswordToggle('login-password');
  EduAPI.enablePasswordToggle('reg-password');

  // If already logged in, go straight to the feed.
  if (EduAPI.getToken() && EduAPI.getUser()) { window.location.href = 'social.html'; }

  function setMode(mode) {
    const isLogin = mode === 'login';
    document.getElementById('login-form').classList.toggle('hidden', !isLogin);
    document.getElementById('register-form').classList.toggle('hidden', isLogin);
    document.getElementById('otp-form').classList.add('hidden');
    document.getElementById('mode-login-btn').className = `flex-1 py-2 rounded-xl text-xs font-bold ${isLogin ? 'btn-primary' : 'text-slate-400'}`;
    document.getElementById('mode-register-btn').className = `flex-1 py-2 rounded-xl text-xs font-bold ${!isLogin ? 'btn-primary' : 'text-slate-400'}`;
  }
  setMode('login');

  let currentCaptchaId = null;
  let pendingOtpToken = null;

  async function loadCaptcha() {
    try {
      const { captchaId, question } = await EduAPI.request('/api/auth/captcha', { auth: false });
      currentCaptchaId = captchaId;
      document.getElementById('captcha-question').textContent = question;
      document.getElementById('captcha-answer').value = '';
    } catch (err) {
      document.getElementById('captcha-question').textContent = '⚠️';
    }
  }
  loadCaptcha();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const captchaAnswer = document.getElementById('captcha-answer').value;
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...';
    try {
      const data = await EduAPI.request('/api/auth/login', {
        method: 'POST',
        body: { identifier, password, captchaId: currentCaptchaId, captchaAnswer },
        auth: false
      });

      if (data.requiresOtp) {
        pendingOtpToken = data.otpToken;
        document.getElementById('otp-message').textContent = data.message + (data.devOtp ? ` (Chưa cấu hình SMTP — mã test: ${data.devOtp})` : '');
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('otp-form').classList.remove('hidden');
        document.getElementById('otp-code').focus();
        return;
      }

      EduAPI.setToken(data.token);
      EduAPI.setUser(data.user);
      window.location.href = 'social.html';
    } catch (err) {
      EduAPI.toast(err.message, 'error');
      loadCaptcha();
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập';
    }
  });

  // NOTE: account creation here calls the same admin-only /api/users endpoint used
  // by the moderation dashboard, so self-serve registration currently requires the
  // backend to allow it — see README for how to wire this to a public endpoint.
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo tài khoản...';
    try {
      await EduAPI.request('/api/auth/register', {
        method: 'POST',
        auth: false,
        body: {
          fullName: document.getElementById('reg-fullname').value.trim(),
          username: document.getElementById('reg-username').value.trim(),
          email: document.getElementById('reg-email').value.trim(),
          phone: document.getElementById('reg-phone').value.trim(),
          password: document.getElementById('reg-password').value
        }
      });
      EduAPI.toast('Đã tạo tài khoản! Hãy đăng nhập.', 'success');
      setMode('login');
      document.getElementById('login-username').value = document.getElementById('reg-username').value.trim();
    } catch (err) {
      EduAPI.toast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Tạo Tài Khoản';
    }
  });

  document.getElementById('otp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('otp-code').value.trim();
    const btn = document.getElementById('otp-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác nhận...';
    try {
      const data = await EduAPI.request('/api/auth/verify-otp', { method: 'POST', body: { otpToken: pendingOtpToken, code }, auth: false });
      EduAPI.setToken(data.token);
      EduAPI.setUser(data.user);
      window.location.href = 'social.html';
    } catch (err) {
      EduAPI.toast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-shield-check"></i> Xác Nhận Đăng Nhập';
    }
  });

  function cancelOtp() {
    pendingOtpToken = null;
    document.getElementById('otp-form').classList.add('hidden');
    document.getElementById('login-form').classList.remove('hidden');
    loadCaptcha();
  }
</script>
</body>
</html>

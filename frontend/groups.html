<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Chat OS — Nhóm</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
<style>
  .group-card{transition:all .2s}
  .group-card:hover{transform:translateY(-2px)}
  .group-cover{height:110px;border-radius:1rem 1rem 0 0;object-fit:cover;width:100%;background:linear-gradient(120deg,#3b82f6,#8b5cf6,#ec4899)}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:1rem}
  .img-grid{display:grid;gap:3px;border-radius:1rem;overflow:hidden}
  .img-grid img{width:100%;height:100%;object-fit:cover;display:block}
  .g1{grid-template-columns:1fr}.g1 img{max-height:420px}
  .g2{grid-template-columns:1fr 1fr}.g2 img{height:220px}
  .g3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.g3 img:first-child{grid-row:1/3}.g3 img{height:100%}
  .g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.g4 img{height:180px}
</style>
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 id="page-title" class="text-lg lg:text-2xl font-black"><i class="fa-solid fa-people-group text-emerald-400 mr-2"></i>Nhóm</h2>
      </div>
      <div class="flex items-center gap-2">
        <a id="back-to-list-btn" href="groups.html" class="hidden text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i>Danh sách nhóm</a>
        <button id="create-group-btn" onclick="openModal('create-group-modal')" class="btn-primary text-xs"><i class="fa-solid fa-plus mr-1"></i>Tạo nhóm mới</button>
      </div>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <!-- List view -->
    <div id="groups-list-view">
      <div id="groups-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </div>

    <!-- Detail view -->
    <div id="group-detail-view" class="hidden">
      <div class="glass-panel rounded-3xl overflow-hidden mb-6">
        <img id="gd-cover" class="group-cover hidden">
        <div id="gd-cover-fallback" class="group-cover"></div>
        <div class="p-5">
          <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
              <h1 id="gd-name" class="text-xl font-black"></h1>
              <p id="gd-desc" class="text-sm text-slate-400 mt-1"></p>
              <p id="gd-meta" class="text-xs text-slate-500 mt-2"></p>
            </div>
            <div class="flex gap-2">
              <button id="gd-join-btn" onclick="toggleMembership()" class="btn-primary text-xs"></button>
              <button id="gd-delete-btn" onclick="deleteGroup()" class="hidden btn-danger text-xs"><i class="fa-solid fa-trash mr-1"></i>Xoá nhóm</button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-4">
          <div id="gd-composer" class="hidden glass-panel p-4 rounded-3xl">
            <textarea id="gp-content" class="input-field" rows="2" placeholder="Đăng gì đó trong nhóm..."></textarea>
            <div id="gp-thumbs" class="flex gap-2 overflow-x-auto mt-3"></div>
            <div class="flex items-center justify-between mt-3">
              <label class="file-field-btn cursor-pointer text-xs" style="display:inline-flex;align-items:center;gap:.4rem">
                <i class="fa-solid fa-images"></i> Thêm ảnh
                <input type="file" id="gp-images" accept="image/*" multiple class="hidden">
              </label>
              <button onclick="createGroupPost()" class="btn-primary text-xs"><i class="fa-solid fa-paper-plane mr-1"></i>Đăng</button>
            </div>
          </div>
          <div id="group-feed"></div>
        </div>
        <div class="glass-panel p-4 rounded-3xl h-fit">
          <h3 class="text-xs font-black text-slate-400 uppercase mb-3">Thành viên</h3>
          <div id="gd-members" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Create group modal -->
<div id="create-group-modal" class="modal-backdrop hidden">
  <div class="glass-panel rounded-3xl p-5 w-full max-w-sm">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-sm"><i class="fa-solid fa-people-group text-emerald-400 mr-1"></i>Tạo nhóm mới</h3>
      <button onclick="closeModal('create-group-modal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <input id="cg-name" class="input-field text-sm mb-3" placeholder="Tên nhóm">
    <textarea id="cg-desc" class="input-field text-sm mb-3" rows="2" placeholder="Mô tả nhóm (không bắt buộc)"></textarea>
    <select id="cg-privacy" class="select-field text-xs mb-4">
      <option value="public">🌐 Công khai</option>
      <option value="private">🔒 Riêng tư</option>
    </select>
    <button onclick="submitGroup()" class="btn-primary w-full text-xs">Tạo nhóm</button>
  </div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  let gpFiles = [];
  let currentGroup = null;

  if (EduLayout.guard('groups')) init();

  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function gridClass(n) { return n === 1 ? 'g1' : n === 2 ? 'g2' : n === 3 ? 'g3' : 'g4'; }
  function imagesGridHtml(urls) {
    if (!urls.length) return '';
    const shown = urls.slice(0, 4); const extra = urls.length - 4;
    return `<div class="img-grid ${gridClass(shown.length)} mb-2">${shown.map((u, i) => `<div style="position:relative"><img src="${u}">${i === 3 && extra > 0 ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800">+${extra}</div>` : ''}</div>`).join('')}</div>`;
  }
  function avatarHtml(u, size = 8) {
    const initials = (u.fullName || u.username || '?').trim().split(/\s+/).slice(-2).map(s => s[0]).join('').toUpperCase();
    return u.avatar ? `<img src="${EduAPI.fileUrl(u.avatar)}" class="w-${size} h-${size} rounded-full object-cover">` : `<div class="avatar-initial w-${size} h-${size} text-xs">${initials}</div>`;
  }

  function init() {
    const id = new URLSearchParams(location.search).get('id');
    if (id) { showDetail(id); } else { showList(); }
  }

  function showList() {
    document.getElementById('groups-list-view').classList.remove('hidden');
    document.getElementById('group-detail-view').classList.add('hidden');
    document.getElementById('back-to-list-btn').classList.add('hidden');
    document.getElementById('create-group-btn').classList.remove('hidden');
    document.getElementById('page-title').innerHTML = '<i class="fa-solid fa-people-group text-emerald-400 mr-2"></i>Nhóm';
    loadGroups();
  }

  async function loadGroups() {
    const { groups } = await EduAPI.request('/api/groups');
    const grid = document.getElementById('groups-grid');
    grid.innerHTML = groups.map(g => `
      <div class="glass-panel rounded-3xl overflow-hidden group-card">
        ${g.cover ? `<img src="${EduAPI.fileUrl(g.cover)}" class="group-cover">` : `<div class="group-cover"></div>`}
        <div class="p-4">
          <h3 class="font-black text-sm truncate">${escapeHtml(g.name)}</h3>
          <p class="text-xs text-slate-400 line-clamp-2 mt-1 h-8 overflow-hidden">${escapeHtml(g.description) || 'Chưa có mô tả.'}</p>
          <p class="text-[10px] text-slate-500 mt-2"><i class="fa-solid fa-users mr-1"></i>${g.memberCount} thành viên · ${g.postCount} bài viết</p>
          <div class="flex gap-2 mt-3">
            <a href="groups.html?id=${g.id}" class="flex-1 text-center text-xs py-2 rounded-xl bg-white/5 hover:bg-white/10 font-bold">Xem nhóm</a>
            ${!g.isMember ? `<button onclick="quickJoin('${g.id}')" class="btn-primary text-xs px-3">Tham gia</button>` : `<span class="text-[10px] text-emerald-400 font-bold flex items-center px-2"><i class="fa-solid fa-circle-check mr-1"></i>Đã tham gia</span>`}
          </div>
        </div>
      </div>`).join('') || '<p class="text-slate-500 text-sm glass-panel p-6 rounded-3xl col-span-full text-center">Chưa có nhóm nào. Hãy tạo nhóm đầu tiên!</p>';
  }
  async function quickJoin(id) { await EduAPI.request(`/api/groups/${id}/join`, { method: 'POST' }); loadGroups(); }

  async function submitGroup() {
    const name = document.getElementById('cg-name').value.trim();
    if (!name) { EduAPI.toast('Hãy nhập tên nhóm.', 'error'); return; }
    try {
      const { group } = await EduAPI.request('/api/groups', { method: 'POST', body: {
        name, description: document.getElementById('cg-desc').value.trim(), privacy: document.getElementById('cg-privacy').value
      }});
      closeModal('create-group-modal');
      EduAPI.toast('Đã tạo nhóm!', 'success');
      window.location.href = `groups.html?id=${group.id}`;
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  async function showDetail(id) {
    document.getElementById('groups-list-view').classList.add('hidden');
    document.getElementById('group-detail-view').classList.remove('hidden');
    document.getElementById('back-to-list-btn').classList.remove('hidden');
    document.getElementById('create-group-btn').classList.add('hidden');
    try {
      const { group, posts } = await EduAPI.request(`/api/groups/${id}`);
      currentGroup = group;
      document.getElementById('page-title').textContent = group.name;
      renderDetail(group, posts);
    } catch (err) { EduAPI.toast(err.message, 'error'); window.location.href = 'groups.html'; }
  }

  function renderDetail(group, posts) {
    const me = EduAPI.getUser();
    document.getElementById('gd-name').textContent = group.name;
    document.getElementById('gd-desc').textContent = group.description || 'Chưa có mô tả.';
    document.getElementById('gd-meta').innerHTML = `<i class="fa-solid fa-users mr-1"></i>${group.memberCount} thành viên · <i class="fa-solid fa-note-sticky mr-1"></i>${group.postCount} bài viết · ${group.privacy === 'private' ? '🔒 Riêng tư' : '🌐 Công khai'}`;
    if (group.cover) { document.getElementById('gd-cover').src = EduAPI.fileUrl(group.cover); document.getElementById('gd-cover').classList.remove('hidden'); document.getElementById('gd-cover-fallback').classList.add('hidden'); }

    const joinBtn = document.getElementById('gd-join-btn');
    const isOwner = group.ownerId === me.id;
    if (isOwner) { joinBtn.textContent = 'Bạn là chủ nhóm'; joinBtn.disabled = true; joinBtn.classList.add('opacity-60'); }
    else { joinBtn.disabled = false; joinBtn.classList.remove('opacity-60'); joinBtn.textContent = group.isMember ? 'Rời nhóm' : 'Tham gia nhóm'; }
    document.getElementById('gd-delete-btn').classList.toggle('hidden', !(isOwner || me.role === 'admin'));
    document.getElementById('gd-composer').classList.toggle('hidden', !group.isMember);

    document.getElementById('gd-members').innerHTML = group.members.map(u => `
      <div class="flex items-center gap-2 p-2 rounded-xl hover:bg-white/5">
        <a href="profile.html?id=${u.id}">${avatarHtml(u)}</a>
        <a href="profile.html?id=${u.id}" class="text-xs font-bold truncate flex-1 hover:underline">${u.fullName || u.username}${u.id === group.ownerId ? ' <span class=\'text-emerald-400\'>(Chủ nhóm)</span>' : ''}</a>
      </div>`).join('');

    document.getElementById('group-feed').innerHTML = posts.map(p => `
      <div class="glass-panel p-4 rounded-3xl mb-4">
        <div class="flex items-center gap-3 mb-2">
          ${p.author ? `<a href="profile.html?id=${p.author.id}">${avatarHtml(p.author)}</a>` : ''}
          <div>
            <a href="profile.html?id=${p.author ? p.author.id : ''}" class="font-bold text-sm hover:underline">${p.author ? (p.author.fullName || p.author.username) : 'Ẩn danh'}</a>
            <p class="text-[10px] text-slate-500">${new Date(p.createdAt).toLocaleString('vi-VN')}</p>
          </div>
        </div>
        <p class="text-sm mb-2 whitespace-pre-wrap">${escapeHtml(p.content)}</p>
        ${imagesGridHtml((p.images || []).map(EduAPI.fileUrl))}
        <div class="flex items-center gap-4 text-xs text-slate-400 border-t border-white/5 pt-2">
          <button onclick="likeGroupPost('${p.id}')" class="hover:text-pink-400"><i class="fa-solid fa-heart mr-1"></i>${p.likeCount} Thích</button>
          <span><i class="fa-solid fa-comment mr-1"></i>${p.commentCount} Bình luận</span>
        </div>
      </div>`).join('') || '<p class="text-slate-500 text-sm glass-panel p-4 rounded-3xl">Chưa có bài viết nào trong nhóm.</p>';
  }

  async function toggleMembership() {
    const action = currentGroup.isMember ? 'leave' : 'join';
    try {
      await EduAPI.request(`/api/groups/${currentGroup.id}/${action}`, { method: 'POST' });
      showDetail(currentGroup.id);
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
  async function deleteGroup() {
    if (!confirm('Xoá nhóm này vĩnh viễn?')) return;
    await EduAPI.request(`/api/groups/${currentGroup.id}`, { method: 'DELETE' });
    window.location.href = 'groups.html';
  }

  document.getElementById('gp-images').addEventListener('change', e => {
    gpFiles = gpFiles.concat(Array.from(e.target.files)).slice(0, 6);
    e.target.value = '';
    document.getElementById('gp-thumbs').innerHTML = gpFiles.map((f, i) => `
      <div style="position:relative;width:72px;height:72px;flex:0 0 auto">
        <img src="${URL.createObjectURL(f)}" style="width:100%;height:100%;object-fit:cover;border-radius:.6rem">
        <div onclick="gpFiles.splice(${i},1);document.getElementById('gp-images').dispatchEvent(new Event('change'))" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer"><i class="fa-solid fa-xmark"></i></div>
      </div>`).join('');
  });

  async function createGroupPost() {
    const content = document.getElementById('gp-content').value.trim();
    if (!content && !gpFiles.length) return;
    const fd = new FormData();
    fd.append('content', content);
    gpFiles.forEach(f => fd.append('images', f));
    try {
      await EduAPI.request(`/api/groups/${currentGroup.id}/posts`, { method: 'POST', body: fd, isForm: true });
      document.getElementById('gp-content').value = '';
      gpFiles = []; document.getElementById('gp-thumbs').innerHTML = '';
      showDetail(currentGroup.id);
      EduAPI.toast('Đã đăng bài trong nhóm!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
  async function likeGroupPost(postId) { await EduAPI.request(`/api/groups/${currentGroup.id}/posts/${postId}/like`, { method: 'POST' }); showDetail(currentGroup.id); }
</script>
</body>
</html>

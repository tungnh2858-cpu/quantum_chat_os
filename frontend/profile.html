<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang cá nhân — Quantum Chat OS</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
<style>
  .cover-wrap{position:relative;height:260px;border-radius:1.5rem;overflow:hidden;background:linear-gradient(120deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b);}
  .cover-wrap img{width:100%;height:100%;object-fit:cover}
  .cover-edit-btn{position:absolute;bottom:12px;right:12px}
  .avatar-wrap{position:relative;width:132px;height:132px;margin-top:-66px;margin-left:24px}
  .avatar-wrap img,.avatar-wrap .avatar-initial{width:132px;height:132px;border:4px solid var(--edu-panel-border);border-radius:9999px;object-fit:cover;font-size:2rem}
  .avatar-edit-btn{position:absolute;bottom:4px;right:4px;width:34px;height:34px;border-radius:9999px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--edu-panel-border)}
  .tab-btn{padding:.6rem 1rem;border-radius:.75rem;font-weight:700;font-size:.8rem}
  .tab-btn.active{background:linear-gradient(90deg,#00f0ff,#6d28d9);color:#fff}
  .photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
  .photos-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:.6rem}
</style>
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <a href="social.html" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Về Bảng Tin</a>
      </div>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div class="glass-panel rounded-3xl p-4 mb-6">
      <div class="cover-wrap">
        <img id="cover-img" class="hidden">
        <button id="cover-edit-btn" class="cover-edit-btn btn-primary text-xs hidden" onclick="document.getElementById('cover-input').click()"><i class="fa-solid fa-camera mr-1"></i>Đổi ảnh bìa</button>
        <input type="file" id="cover-input" accept="image/*" class="hidden">
      </div>
      <div class="flex flex-wrap items-end justify-between gap-3 px-2">
        <div class="flex items-end gap-4">
          <div class="avatar-wrap">
            <div id="avatar-box"></div>
            <button id="avatar-edit-btn" class="avatar-edit-btn hidden" onclick="document.getElementById('avatar-input').click()"><i class="fa-solid fa-camera text-xs"></i></button>
            <input type="file" id="avatar-input" accept="image/*" class="hidden">
          </div>
          <div class="pb-2">
            <h1 id="profile-name" class="text-2xl font-black"></h1>
            <p id="profile-meta" class="text-xs text-slate-400"></p>
          </div>
        </div>
        <div class="pb-2">
          <button id="edit-profile-btn" onclick="openModal('edit-profile-modal')" class="hidden btn-primary text-xs"><i class="fa-solid fa-pen mr-1"></i>Chỉnh sửa trang cá nhân</button>
        </div>
      </div>
      <p id="profile-bio" class="px-2 mt-3 text-sm text-slate-300 whitespace-pre-wrap"></p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <div class="glass-panel p-2 rounded-2xl flex gap-2">
          <button class="tab-btn active" id="tab-posts-btn" onclick="switchTab('posts')"><i class="fa-solid fa-note-sticky mr-1"></i>Bài viết</button>
          <button class="tab-btn" id="tab-photos-btn" onclick="switchTab('photos')"><i class="fa-solid fa-images mr-1"></i>Ảnh</button>
        </div>
        <div id="posts-tab"><div id="profile-feed"></div></div>
        <div id="photos-tab" class="hidden glass-panel p-4 rounded-3xl">
          <div id="photos-grid" class="photos-grid"></div>
        </div>
      </div>
      <div class="glass-panel p-4 rounded-3xl h-fit">
        <h3 class="text-xs font-black text-slate-400 uppercase mb-3">Giới thiệu</h3>
        <p id="about-role" class="text-sm mb-2"><i class="fa-solid fa-shield-halved text-cyan-400 mr-2"></i><span></span></p>
        <p id="about-joined" class="text-sm mb-2"><i class="fa-solid fa-calendar-days text-fuchsia-400 mr-2"></i><span></span></p>
        <p id="about-posts" class="text-sm"><i class="fa-solid fa-note-sticky text-amber-400 mr-2"></i><span></span></p>
      </div>
    </div>
  </main>
</div>

<!-- Edit profile modal -->
<div id="edit-profile-modal" class="fixed inset-0 bg-black/75 z-[2000] hidden items-center justify-center p-4">
  <div class="glass-panel rounded-3xl p-5 w-full max-w-md">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-sm">Chỉnh sửa trang cá nhân</h3>
      <button onclick="closeModal('edit-profile-modal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <label class="text-xs font-bold text-slate-400">Tên hiển thị</label>
    <input id="edit-fullname" class="input-field text-sm mb-3 mt-1">
    <label class="text-xs font-bold text-slate-400">Email</label>
    <input id="edit-email" class="input-field text-sm mb-3 mt-1">
    <label class="text-xs font-bold text-slate-400">Tiểu sử</label>
    <textarea id="edit-bio" rows="3" class="input-field text-sm mb-4 mt-1"></textarea>
    <button onclick="saveProfile()" class="btn-primary w-full text-xs">Lưu thay đổi</button>
  </div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  let profileUser = null, isOwn = false;

  if (EduLayout.guard('social')) init();

  function openModal(id) { const el = document.getElementById(id); el.classList.remove('hidden'); el.classList.add('flex'); }
  function closeModal(id) { const el = document.getElementById(id); el.classList.add('hidden'); el.classList.remove('flex'); }

  function initials(name) { return (name || '?').trim().split(/\s+/).slice(-2).map(s => s[0]).join('').toUpperCase(); }

  async function init() {
    const params = new URLSearchParams(location.search);
    const me = EduAPI.getUser();
    const id = params.get('id') || me.id;
    isOwn = id === me.id;
    try {
      const { user } = await EduAPI.request(`/api/users/${id}`);
      profileUser = user;
      render();
      loadPosts();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  function render() {
    const u = profileUser;
    document.getElementById('profile-name').textContent = u.fullName || u.username;
    document.getElementById('profile-meta').textContent = `@${u.username}`;
    document.getElementById('profile-bio').textContent = u.bio || (isOwn ? 'Chưa có tiểu sử — nhấn "Chỉnh sửa trang cá nhân" để thêm.' : '');
    document.getElementById('about-role').querySelector('span').textContent = u.role === 'admin' ? 'Quản trị viên' : u.role;
    document.getElementById('about-joined').querySelector('span').textContent = 'Tham gia ' + new Date(u.createdAt).toLocaleDateString('vi-VN');
    document.getElementById('about-posts').querySelector('span').textContent = `${u.postCount} bài viết`;

    const cover = document.getElementById('cover-img');
    if (u.coverImage) { cover.src = EduAPI.fileUrl(u.coverImage); cover.classList.remove('hidden'); } else cover.classList.add('hidden');

    document.getElementById('avatar-box').innerHTML = u.avatar
      ? `<img src="${EduAPI.fileUrl(u.avatar)}">`
      : `<div class="avatar-initial">${initials(u.fullName || u.username)}</div>`;

    if (isOwn) {
      document.getElementById('cover-edit-btn').classList.remove('hidden');
      document.getElementById('avatar-edit-btn').classList.remove('hidden');
      document.getElementById('edit-profile-btn').classList.remove('hidden');
      document.getElementById('edit-fullname').value = u.fullName || '';
      document.getElementById('edit-email').value = u.email || '';
      document.getElementById('edit-bio').value = u.bio || '';
    }
  }

  document.getElementById('cover-input').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const fd = new FormData(); fd.append('cover', file);
    try {
      const { user } = await EduAPI.request('/api/users/me/cover', { method: 'POST', body: fd, isForm: true });
      profileUser.coverImage = user.coverImage;
      const me = EduAPI.getUser(); me.coverImage = user.coverImage; EduAPI.setUser(me);
      render();
      EduAPI.toast('Đã cập nhật ảnh bìa!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  });
  document.getElementById('avatar-input').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const fd = new FormData(); fd.append('avatar', file);
    try {
      const { user } = await EduAPI.request('/api/users/me/avatar', { method: 'POST', body: fd, isForm: true });
      profileUser.avatar = user.avatar;
      const me = EduAPI.getUser(); me.avatar = user.avatar; EduAPI.setUser(me);
      render();
      EduAPI.toast('Đã cập nhật ảnh đại diện!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  });

  async function saveProfile() {
    const body = {
      fullName: document.getElementById('edit-fullname').value.trim(),
      email: document.getElementById('edit-email').value.trim(),
      bio: document.getElementById('edit-bio').value.trim()
    };
    try {
      const { user } = await EduAPI.request('/api/users/me/profile', { method: 'PUT', body });
      const me = EduAPI.getUser();
      Object.assign(me, { fullName: user.fullName, email: user.email, bio: user.bio });
      EduAPI.setUser(me);
      profileUser.fullName = user.fullName; profileUser.bio = user.bio;
      render(); closeModal('edit-profile-modal');
      EduAPI.toast('Đã lưu trang cá nhân!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  function switchTab(tab) {
    document.getElementById('posts-tab').classList.toggle('hidden', tab !== 'posts');
    document.getElementById('photos-tab').classList.toggle('hidden', tab !== 'photos');
    document.getElementById('tab-posts-btn').classList.toggle('active', tab === 'posts');
    document.getElementById('tab-photos-btn').classList.toggle('active', tab === 'photos');
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function gridClass(n) { return n === 1 ? 'g1' : n === 2 ? 'g2' : n === 3 ? 'g3' : 'g4'; }

  async function loadPosts() {
    const { posts } = await EduAPI.request(`/api/posts?authorId=${profileUser.id}`);
    const me = EduAPI.getUser();
    document.getElementById('profile-feed').innerHTML = posts.map(p => {
      const imgs = (p.images && p.images.length ? p.images : (p.image ? [p.image] : [])).map(EduAPI.fileUrl);
      const shown = imgs.slice(0, 4);
      const extra = imgs.length - 4;
      const gridHtml = shown.length ? `<div style="display:grid;gap:3px;border-radius:1rem;overflow:hidden" class="mb-2 img-grid-${shown.length}">${shown.map((u, i) => `<div style="position:relative"><img src="${u}" style="width:100%;height:${shown.length===1?'420px':'220px'};object-fit:cover;display:block">${i===3&&extra>0?`<div style="position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800">+${extra}</div>`:''}</div>`).join('')}</div>` : '';
      return `
      <div class="glass-panel p-4 rounded-3xl mb-4">
        <div class="flex items-center justify-between mb-2">
          <p class="text-[10px] text-slate-500">${new Date(p.createdAt).toLocaleString('vi-VN')}</p>
          ${(p.author && p.author.id === me.id) || me.role === 'admin' ? `<button onclick="deletePost('${p.id}')" class="text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
        <p class="text-sm mb-2 whitespace-pre-wrap">${escapeHtml(p.content)}</p>
        ${gridHtml}
        <div class="flex items-center gap-4 text-xs text-slate-400 border-t border-white/5 pt-2">
          <button onclick="likePost('${p.id}')" class="hover:text-pink-400"><i class="fa-solid fa-heart mr-1"></i>${p.likeCount} Thích</button>
          <span><i class="fa-solid fa-comment mr-1"></i>${p.commentCount} Bình luận</span>
        </div>
      </div>`;
    }).join('') || '<p class="text-slate-500 text-sm glass-panel p-4 rounded-3xl">Chưa có bài viết nào.</p>';

    const allImgs = posts.flatMap(p => (p.images && p.images.length ? p.images : (p.image ? [p.image] : []))).map(EduAPI.fileUrl);
    document.getElementById('photos-grid').innerHTML = allImgs.map(u => `<img src="${u}">`).join('') || '<p class="text-slate-500 text-sm col-span-full">Chưa có ảnh nào.</p>';
  }
  async function likePost(id) { await EduAPI.request(`/api/posts/${id}/like`, { method: 'POST' }); loadPosts(); }
  async function deletePost(id) { if (!confirm('Xoá bài viết này?')) return; await EduAPI.request(`/api/posts/${id}`, { method: 'DELETE' }); loadPosts(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tin Nhắn — Quantum Chat OS</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<link rel="icon" type="image/svg+xml" href="assets/img/quantum-chat-logo.svg"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/tailwind.built.css?v=20260830">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
<style>
  .convo-item{display:flex;align-items:center;gap:.7rem;padding:.7rem;border-radius:1rem;cursor:pointer}
  .convo-item:hover{background:rgba(255,255,255,.05)}
  .convo-item.active{background:rgba(0,240,255,.08)}
  .online-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:9999px;background:#22c55e;border:2px solid #0d0b18}
  .avatar-wrap-sm{position:relative;flex:0 0 auto}
  .bubble{max-width:72%;padding:.55rem .9rem;border-radius:1.1rem;font-size:.85rem;line-height:1.4;word-break:break-word}
  .bubble.mine{background:linear-gradient(90deg,#00c8ff,#7c3aed);color:#fff;border-bottom-right-radius:.3rem}
  .bubble.theirs{background:rgba(255,255,255,.08);color:#e5e7eb;border-bottom-left-radius:.3rem}
  .bubble img{max-width:220px;border-radius:.8rem;display:block}
  .msg-row{display:flex;margin-bottom:.35rem}
  .msg-row.mine{justify-content:flex-end}
  .msg-row.theirs{justify-content:flex-start}
  .typing-dots span{width:6px;height:6px;background:#94a3b8;border-radius:9999px;display:inline-block;margin:0 1px;animation:qc-typing 1.2s infinite}
  .typing-dots span:nth-child(2){animation-delay:.2s}
  .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes qc-typing{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
</style>
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex overflow-hidden p-4 lg:p-6 gap-4">
    <!-- Conversation list -->
    <div id="convo-panel" class="w-full lg:w-80 flex-shrink-0 glass-panel rounded-3xl p-3 flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-2 py-2">
        <h2 class="font-black text-lg"><i class="fa-solid fa-comment-dots text-cyan-400 mr-2"></i>Tin Nhắn</h2>
        <a href="social.html" class="lg:hidden text-slate-400"><i class="fa-solid fa-arrow-left"></i></a>
      </div>
      <div class="relative px-2 mb-2">
        <input id="convo-search" class="input-field text-xs !pl-8" placeholder="Tìm cuộc trò chuyện...">
        <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
      </div>
      <div id="convo-list" class="flex-1 overflow-y-auto px-1 space-y-1"></div>
    </div>

    <!-- Active thread -->
    <div id="thread-panel" class="hidden flex-1 glass-panel rounded-3xl flex-col overflow-hidden">
      <div class="p-4 border-b border-white/10 flex items-center gap-3">
        <button class="lg:hidden text-slate-400" onclick="backToList()"><i class="fa-solid fa-arrow-left"></i></button>
        <div id="thread-avatar" class="avatar-wrap-sm"></div>
        <div class="flex-1 min-w-0">
          <p id="thread-name" class="font-bold text-sm flex items-center gap-1 truncate"></p>
          <p id="thread-status" class="text-[11px] text-slate-500"></p>
        </div>
        <a id="thread-profile-link" href="#" class="text-slate-400 hover:text-white" title="Xem trang cá nhân"><i class="fa-solid fa-circle-info"></i></a>
      </div>
      <div id="thread-messages" class="flex-1 overflow-y-auto p-4"></div>
      <div id="typing-indicator" class="hidden px-4 pb-1 text-xs text-slate-500 items-center gap-1">
        <span class="typing-dots"><span></span><span></span><span></span></span> đang nhập...
      </div>
      <div id="image-preview-row" class="hidden px-4 pb-2">
        <div class="relative inline-block">
          <img id="image-preview-img" class="w-20 h-20 object-cover rounded-xl">
          <button onclick="clearImageAttach()" class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-black/70 text-white text-[10px] flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="p-3 border-t border-white/10 flex items-center gap-2">
        <label class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center cursor-pointer text-cyan-300 flex-shrink-0">
          <i class="fa-solid fa-image"></i>
          <input type="file" id="chat-image-input" accept="image/*" class="hidden">
        </label>
        <input id="chat-input" class="input-field text-sm" placeholder="Nhập tin nhắn...">
        <button type="button" id="chat-emoji-btn" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-amber-300 flex-shrink-0" title="Chèn emoji"><i class="fa-solid fa-face-smile"></i></button>
        <button onclick="sendMessage()" class="w-10 h-10 rounded-full btn-primary flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <div id="chat-empty-state" class="hidden flex-1 glass-panel rounded-3xl items-center justify-center flex-col text-center p-8">
      <i class="fa-solid fa-comments text-5xl text-slate-700 mb-4"></i>
      <p class="text-slate-500 text-sm">Chọn một cuộc trò chuyện để bắt đầu nhắn tin.</p>
    </div>
  </main>
</div>

<script src="assets/js/particles.js?v=20260830"></script>
<script src="assets/js/config.js?v=20260830"></script>
<script src="assets/js/cursor.js?v=20260830"></script>
<script src="assets/js/api.js?v=20260830"></script>
<script src="assets/js/layout.js?v=20260830"></script>
<script src="assets/js/emoji-picker.js?v=20260830"></script>
<script>
  let conversations = [];
  let activePartnerId = null;
  let ws = null;
  let typingTimeout = null;
  let sendTypingThrottle = 0;
  let imageAttachFile = null;

  if (EduLayout.guard('messages')) {
    loadConversations();
    connectSocket();
    EduEmoji.attach(document.getElementById('chat-emoji-btn'), document.getElementById('chat-input'));
    const withId = new URLSearchParams(location.search).get('with');
    if (withId) {
      openThread(withId);
    } else {
      const empty = document.getElementById('chat-empty-state');
      empty.classList.remove('hidden');
      if (window.innerWidth >= 1024) empty.classList.add('flex');
    }
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function initials(name) { return (name || '?').trim().split(/\s+/).slice(-2).map(s => s[0]).join('').toUpperCase(); }
  function avatarHtml(u, size) {
    return u.avatar
      ? `<img src="${EduAPI.fileUrl(u.avatar)}" class="w-${size} h-${size} rounded-full object-cover" onerror="this.onerror=null;this.src='assets/img/broken-image.svg'">`
      : `<img src="assets/img/default-avatar.svg" class="w-${size} h-${size} rounded-full object-cover">`;
  }
  function timeShort(iso) {
    const d = new Date(iso);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
  }

  async function loadConversations() {
    const { conversations: list } = await EduAPI.request('/api/messages');
    conversations = list;
    renderConvoList();
  }

  function renderConvoList(filter) {
    const q = (filter || '').toLowerCase();
    const filtered = conversations.filter(c => !q || (c.partner.fullName || c.partner.username || '').toLowerCase().includes(q));
    document.getElementById('convo-list').innerHTML = filtered.map(c => `
      <div class="convo-item ${c.partner.id === activePartnerId ? 'active' : ''}" onclick="openThread('${c.partner.id}')">
        <div class="avatar-wrap-sm">${avatarHtml(c.partner, 12)}${c.partner.online ? '<span class="online-dot"></span>' : ''}</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold truncate flex items-center gap-1">${escapeHtml(c.partner.fullName || c.partner.username)}${EduLayout.verifiedBadge(c.partner)}</p>
          <p class="text-xs truncate ${c.unreadCount ? 'text-slate-100 font-bold' : 'text-slate-500'}">${c.lastMessage.deleted ? 'Tin nhắn đã được thu hồi' : (c.lastMessage.image && !c.lastMessage.content ? '📷 Đã gửi một ảnh' : escapeHtml(c.lastMessage.content))}</p>
        </div>
        <div class="flex flex-col items-end gap-1">
          <span class="text-[10px] text-slate-500">${timeShort(c.lastMessage.createdAt)}</span>
          ${c.unreadCount ? `<span class="w-5 h-5 rounded-full bg-cyan-500 text-[10px] font-black flex items-center justify-center">${c.unreadCount}</span>` : ''}
        </div>
      </div>`).join('') || '<p class="text-xs text-slate-500 p-3">Chưa có cuộc trò chuyện nào. Vào trang Bạn Bè và bấm biểu tượng nhắn tin để bắt đầu!</p>';
  }
  document.getElementById('convo-search').addEventListener('input', e => renderConvoList(e.target.value));

  function backToList() {
    document.getElementById('thread-panel').classList.add('hidden');
    document.getElementById('convo-panel').classList.remove('hidden');
    activePartnerId = null;
  }

  async function openThread(partnerId) {
    activePartnerId = partnerId;
    const empty = document.getElementById('chat-empty-state');
    empty.classList.add('hidden'); empty.classList.remove('flex');
    document.getElementById('thread-panel').classList.remove('hidden');
    document.getElementById('thread-panel').classList.add('flex');
    if (window.innerWidth < 1024) document.getElementById('convo-panel').classList.add('hidden');

    const { messages, partner } = await EduAPI.request(`/api/messages/${partnerId}`);
    if (partner) {
      document.getElementById('thread-avatar').innerHTML = avatarHtml(partner, 10) + (partner.online ? '<span class="online-dot"></span>' : '');
      document.getElementById('thread-name').innerHTML = `${escapeHtml(partner.fullName || partner.username)}${EduLayout.verifiedBadge(partner)}`;
      document.getElementById('thread-status').textContent = partner.online ? 'Đang hoạt động' : 'Ngoại tuyến';
      document.getElementById('thread-profile-link').href = `profile.html?id=${partner.id}`;
    }
    renderMessages(messages);
    renderConvoList(document.getElementById('convo-search').value);
    loadConversations(); // refresh unread badges now that this thread was marked read
  }

  function bubbleContent(m, isMine) {
    if (m.deleted) return `<span class="italic opacity-60">${isMine ? 'Bạn đã thu hồi một tin nhắn' : 'Tin nhắn đã được thu hồi'}</span>`;
    let html = '';
    if (m.image) html += `<img src="${EduAPI.fileUrl(m.image)}" onerror="this.onerror=null;this.src='assets/img/broken-image.svg'" class="${m.content ? 'mb-1' : ''}">`;
    if (m.content) html += escapeHtml(m.content);
    return html;
  }

  function renderMessages(messages) {
    const me = EduAPI.getUser();
    const box = document.getElementById('thread-messages');
    let lastMineReadIdx = -1;
    messages.forEach((m, i) => { if (m.fromId === me.id && m.read) lastMineReadIdx = i; });

    box.innerHTML = messages.map((m, i) => {
      const isMine = m.fromId === me.id;
      return `
      <div class="msg-row ${isMine ? 'mine' : 'theirs'}" data-msg-id="${m.id}">
        <div>
          <div class="bubble ${isMine ? 'mine' : 'theirs'}">${bubbleContent(m, isMine)}</div>
          <div class="flex items-center gap-2 mt-0.5 ${isMine ? 'justify-end' : 'justify-start'}">
            <span class="text-[10px] text-slate-600">${timeShort(m.createdAt)}</span>
            ${isMine && !m.deleted ? `<button onclick="deleteMessage('${m.id}')" class="text-[10px] text-slate-600 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>` : ''}
          </div>
          ${isMine && i === lastMineReadIdx ? '<p class="text-[10px] text-cyan-400 text-right mt-0.5">Đã xem</p>' : ''}
        </div>
      </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const content = input.value.trim();
    if (!content && !imageAttachFile) return;
    if (!activePartnerId) return;
    const fd = new FormData();
    fd.append('toId', activePartnerId);
    if (content) fd.append('content', content);
    if (imageAttachFile) fd.append('image', imageAttachFile);
    input.value = '';
    clearImageAttach();
    try {
      const { message } = await EduAPI.request('/api/messages', { method: 'POST', body: fd, isForm: true });
      appendLiveMessage(message);
    } catch (err) {
      EduAPI.toast(err.message, 'error');
      input.value = content;
    }
  }
  document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  document.getElementById('chat-input').addEventListener('input', () => {
    if (!activePartnerId || !ws || ws.readyState !== 1) return;
    const now = Date.now();
    if (now - sendTypingThrottle > 1500) {
      ws.send(JSON.stringify({ type: 'typing', toId: activePartnerId }));
      sendTypingThrottle = now;
    }
  });

  document.getElementById('chat-image-input').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    imageAttachFile = file;
    document.getElementById('image-preview-img').src = URL.createObjectURL(file);
    document.getElementById('image-preview-row').classList.remove('hidden');
    e.target.value = '';
  });
  function clearImageAttach() {
    imageAttachFile = null;
    document.getElementById('image-preview-row').classList.add('hidden');
  }

  function appendLiveMessage(m) {
    if (activePartnerId && (m.fromId === activePartnerId || m.toId === activePartnerId)) {
      const box = document.getElementById('thread-messages');
      if (!box.querySelector(`[data-msg-id="${m.id}"]`)) {
        const me = EduAPI.getUser();
        const isMine = m.fromId === me.id;
        box.insertAdjacentHTML('beforeend', `
          <div class="msg-row ${isMine ? 'mine' : 'theirs'}" data-msg-id="${m.id}">
            <div>
              <div class="bubble ${isMine ? 'mine' : 'theirs'}">${bubbleContent(m, isMine)}</div>
              <div class="flex items-center gap-2 mt-0.5 ${isMine ? 'justify-end' : 'justify-start'}">
                <span class="text-[10px] text-slate-600">${timeShort(m.createdAt)}</span>
                ${isMine ? `<button onclick="deleteMessage('${m.id}')" class="text-[10px] text-slate-600 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>` : ''}
              </div>
            </div>
          </div>`);
        box.scrollTop = box.scrollHeight;
      }
      if (m.fromId === activePartnerId) EduAPI.request(`/api/messages/${activePartnerId}`).catch(() => {}); // mark read + refresh ticks
    }
    loadConversations();
  }

  async function deleteMessage(id) {
    if (!confirm('Thu hồi tin nhắn này?')) return;
    try {
      await EduAPI.request(`/api/messages/${id}`, { method: 'DELETE' });
      const row = document.querySelector(`[data-msg-id="${id}"] .bubble`);
      if (row) row.innerHTML = '<span class="italic opacity-60">Bạn đã thu hồi một tin nhắn</span>';
      loadConversations();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  function connectSocket() {
    ws = EduAPI.openChatSocket(msg => {
      if (msg.type === 'chat') appendLiveMessage(msg.message);
      if (msg.type === 'chat_delete' && document.querySelector(`[data-msg-id="${msg.id}"]`)) {
        document.querySelector(`[data-msg-id="${msg.id}"] .bubble`).innerHTML = '<span class="italic opacity-60">Tin nhắn đã được thu hồi</span>';
      }
      if (msg.type === 'typing' && msg.fromId === activePartnerId) {
        const el = document.getElementById('typing-indicator');
        el.classList.remove('hidden'); el.classList.add('flex');
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { el.classList.add('hidden'); el.classList.remove('flex'); }, 2500);
      }
      if (msg.type === 'read' && activePartnerId === msg.by) {
        openThread(activePartnerId); // re-render to move the "Đã xem" tick
      }
      if (msg.type === 'presence') {
        const c = conversations.find(c => c.partner.id === msg.userId);
        if (c) { c.partner.online = msg.online; renderConvoList(document.getElementById('convo-search').value); }
        if (msg.userId === activePartnerId) document.getElementById('thread-status').textContent = msg.online ? 'Đang hoạt động' : 'Ngoại tuyến';
      }
    });
  }
</script>
</body>
</html>

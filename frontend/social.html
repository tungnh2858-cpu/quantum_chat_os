<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Chat OS — Bảng Tin</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<link rel="icon" type="image/svg+xml" href="assets/img/quantum-chat-logo.svg"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/tailwind.built.css?v=20260830">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css?v=20260830">
<style>
  .qc-logo-ring{background:conic-gradient(from 180deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b,#3b82f6);padding:2.5px;border-radius:9999px}
  .story-bubble{width:88px;flex:0 0 auto;cursor:pointer}
  .story-thumb{width:88px;height:130px;border-radius:1rem;object-fit:cover}
  .story-ring{padding:2.5px;border-radius:1rem;background:conic-gradient(from 180deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b)}
  .img-grid{display:grid;gap:3px;border-radius:1rem;overflow:hidden}
  .img-grid img{width:100%;height:100%;object-fit:cover;display:block}
  .g1{grid-template-columns:1fr}
  .g1 img{max-height:520px}
  .g2{grid-template-columns:1fr 1fr}
  .g2 img{height:280px}
  .g3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
  .g3 img:first-child{grid-row:1/3}
  .g3 img{height:100%}
  .g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .g4 img{height:200px}
  .compose-thumb{position:relative;flex:0 0 auto;width:88px;height:88px;border-radius:.75rem;overflow:hidden;cursor:grab}
  .compose-thumb img{width:100%;height:100%;object-fit:cover}
  .compose-thumb .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px}
  .compose-thumb.drag-over{outline:2px dashed #00f0ff}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center;padding:1rem}
  .modal-backdrop.is-open{display:flex}
  .modal-backdrop:not(.is-open){display:none}
</style>
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <div class="qc-logo-ring w-10 h-10"><img src="assets/img/quantum-chat-logo.svg" class="w-full h-full rounded-full bg-brand-950"></div>
        <h2 class="text-lg lg:text-2xl font-black leading-tight">Quantum Chat <span class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-amber-300">OS</span></h2>
      </div>
      <div class="flex items-center gap-2">
        <a id="my-profile-link" href="profile.html" class="btn-primary text-xs"><i class="fa-solid fa-id-badge mr-1"></i>Trang cá nhân</a>
        <button onclick="toggleChat()" class="btn-primary text-xs"><i class="fa-solid fa-message mr-1"></i>Trò Chuyện</button>
      </div>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">

        <!-- Stories bar -->
        <div class="glass-panel p-4 rounded-3xl">
          <div id="stories-bar" class="flex gap-3 overflow-x-auto pb-1"></div>
        </div>

        <!-- Composer -->
        <div class="glass-panel p-4 rounded-3xl">
          <textarea id="post-content" class="input-field" rows="3" placeholder="Bạn đang nghĩ gì?"></textarea>
          <div id="compose-thumbs" class="flex gap-2 overflow-x-auto mt-3"></div>
          <div id="compose-video-preview" class="mt-3 hidden relative rounded-2xl overflow-hidden bg-black">
            <video id="compose-video-el" class="w-full max-h-64 object-contain" controls muted></video>
            <button onclick="removeComposeVideo()" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/70 text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="flex items-center justify-between mt-3 flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <label class="file-field-btn cursor-pointer text-xs" style="display:inline-flex;align-items:center;gap:.4rem">
                <i class="fa-solid fa-images"></i> Thêm ảnh
                <input type="file" id="post-images" accept="image/*" multiple class="hidden">
              </label>
              <label class="file-field-btn cursor-pointer text-xs" style="display:inline-flex;align-items:center;gap:.4rem">
                <i class="fa-solid fa-video"></i> Thêm video
                <input type="file" id="post-video" accept="video/*" class="hidden">
              </label>
              <select id="post-privacy" class="select-field text-xs !py-2 !px-3">
                <option value="public">🌐 Công khai</option>
                <option value="friends">👥 Bạn bè</option>
                <option value="private">🔒 Chỉ mình tôi</option>
              </select>
            </div>
            <div class="flex gap-2">
              <button onclick="openPreview()" class="text-xs px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10" id="preview-btn" disabled><i class="fa-solid fa-eye mr-1"></i>Xem trước</button>
              <button onclick="createPost()" class="btn-primary text-xs"><i class="fa-solid fa-paper-plane mr-1"></i>Đăng</button>
            </div>
          </div>
        </div>

        <div id="feed"></div>
      </div>

      <div class="glass-panel p-4 rounded-3xl h-fit">
        <h3 class="text-xs font-black text-slate-400 uppercase mb-3">Bạn Bè</h3>
        <div class="relative mb-3">
          <input id="friend-search-input" class="input-field text-xs !pl-8" placeholder="Tìm bạn mới..." oninput="searchFriends(this.value)">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        </div>
        <div id="friend-search-results" class="space-y-2 mb-3"></div>
        <div id="people-list" class="space-y-2"></div>
      </div>
    </div>
  </main>
</div>

<!-- Add-story modal -->
<div id="story-compose-modal" class="modal-backdrop hidden">
  <div class="glass-panel rounded-3xl p-5 w-full max-w-sm">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-sm"><i class="fa-solid fa-circle-plus text-fuchsia-400 mr-1"></i>Tạo tin (Story)</h3>
      <button onclick="closeModal('story-compose-modal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <img id="story-preview-img" class="w-full h-64 object-cover rounded-2xl mb-3 hidden">
    <label class="file-field-btn cursor-pointer text-xs w-full flex items-center justify-center gap-2 mb-3">
      <i class="fa-solid fa-upload"></i> Chọn ảnh cho tin
      <input type="file" id="story-image" accept="image/*" class="hidden">
    </label>
    <input id="story-caption" class="input-field text-xs mb-3" placeholder="Chú thích (không bắt buộc)">
    <button onclick="submitStory()" class="btn-primary w-full text-xs">Đăng tin (hiển thị 24 giờ)</button>
  </div>
</div>

<!-- Story viewer -->
<div id="story-view-modal" class="modal-backdrop hidden">
  <div class="relative w-full max-w-sm h-[80vh] rounded-3xl overflow-hidden bg-black">
    <div id="story-progress" class="absolute top-2 left-2 right-2 flex gap-1 z-20"></div>
    <div class="absolute top-6 left-2 right-2 flex items-center gap-2 z-20">
      <div id="story-view-avatar" class="w-8 h-8 rounded-full overflow-hidden bg-white/20"></div>
      <span id="story-view-name" class="text-white text-xs font-bold drop-shadow"></span>
      <span id="story-view-time" class="text-white/70 text-[10px]"></span>
      <button id="story-delete-btn" onclick="deleteCurrentStory()" class="ml-auto text-white/80 hidden"><i class="fa-solid fa-trash"></i></button>
      <button onclick="closeModal('story-view-modal')" class="text-white/80"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <img id="story-view-img" class="w-full h-full object-contain bg-black">
    <p id="story-view-caption" class="absolute bottom-4 left-4 right-4 text-white text-sm text-center drop-shadow"></p>
    <button onclick="storyNav(-1)" class="absolute left-0 top-0 bottom-0 w-1/3 z-10"></button>
    <button onclick="storyNav(1)" class="absolute right-0 top-0 bottom-0 w-1/3 z-10"></button>
  </div>
</div>

<!-- Post preview modal (shown before actually posting) -->
<div id="post-preview-modal" class="modal-backdrop hidden">
  <div class="glass-panel rounded-3xl p-5 w-full max-w-lg max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-sm"><i class="fa-solid fa-eye text-cyan-400 mr-1"></i>Xem trước bài viết</h3>
      <button onclick="closeModal('post-preview-modal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="preview-body" class="glass-panel p-4 rounded-2xl"></div>
    <p class="text-[11px] text-slate-500 mt-2"><i class="fa-solid fa-arrows-up-down mr-1"></i>Kéo-thả ảnh ở khung soạn bài để đổi thứ tự bố cục trước khi đăng.</p>
    <button onclick="closeModal('post-preview-modal')" class="btn-primary w-full text-xs mt-3">Đóng xem trước</button>
  </div>
</div>

<!-- Chat panel -->
<div id="chat-panel" class="fixed bottom-4 right-4 w-80 h-[420px] glass-panel rounded-3xl shadow-2xl flex-col hidden z-[1500]">
  <div class="p-3 border-b border-white/10 flex items-center justify-between">
    <span id="chat-title" class="font-black text-sm">Trò chuyện</span>
    <button onclick="toggleChat()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2 text-xs"></div>
  <div class="p-3 border-t border-white/10 flex gap-2">
    <input id="chat-input" class="input-field text-xs" placeholder="Nhập tin nhắn...">
    <button onclick="sendChat()" class="btn-primary text-xs px-3"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<script src="assets/js/particles.js?v=20260830"></script>
<script src="assets/js/config.js?v=20260830"></script>
<script src="assets/js/cursor.js?v=20260830"></script>
<script src="assets/js/api.js?v=20260830"></script>
<script src="assets/js/layout.js?v=20260830"></script>
<script src="assets/js/video-autoplay.js?v=20260830"></script>
<script>
  let people = [], activePartner = null, ws = null;
  let composeFiles = []; // File objects, order = layout order
  let storyFile = null;
  let storyGroups = [], storyGroupIdx = 0, storyIdx = 0, storyTimer = null;

  if (EduLayout.guard('social')) {
    const me = EduAPI.getUser();
    document.getElementById('my-profile-link').href = `profile.html?id=${me.id}`;
    loadFeed(); loadFriends(); loadStories(); connectChat();
    const chatWith = new URLSearchParams(location.search).get('chat');
    if (chatWith) {
      EduAPI.request(`/api/users/${chatWith}`).then(({ user }) => openChat({ id: user.id, username: user.username, fullName: user.fullName, avatar: user.avatar })).catch(() => {});
    }
  }

  function avatarHtml(u, size = 9) {
    const initials = (u.fullName || u.username || '?').trim().split(/\s+/).slice(-2).map(s => s[0]).join('').toUpperCase();
    return u.avatar ? `<img src="${EduAPI.fileUrl(u.avatar)}" class="w-${size} h-${size} rounded-full object-cover" onerror="this.onerror=null;this.src=&quot;assets/img/broken-image.svg&quot;;this.classList.add(&quot;opacity-40&quot;)">` : `<div class="avatar-initial w-${size} h-${size} text-xs">${initials}</div>`;
  }
  function nameHtml(u) { return `${escapeHtml(u.fullName || u.username)}${EduLayout.verifiedBadge(u)}`; }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  /* ---------------- Composer: multi-image select + drag reorder + preview ---------------- */
  let composeVideoFile = null;
  document.getElementById('post-images').addEventListener('change', e => {
    if (composeVideoFile) { removeComposeVideo(); }
    composeFiles = composeFiles.concat(Array.from(e.target.files)).slice(0, 10);
    e.target.value = '';
    renderComposeThumbs();
  });
  document.getElementById('post-video').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    composeFiles = []; renderComposeThumbs(); // images and video are mutually exclusive in one post
    composeVideoFile = file;
    const el = document.getElementById('compose-video-el');
    el.src = URL.createObjectURL(file);
    document.getElementById('compose-video-preview').classList.remove('hidden');
    e.target.value = '';
    document.getElementById('preview-btn').disabled = false;
  });
  function removeComposeVideo() {
    composeVideoFile = null;
    document.getElementById('compose-video-preview').classList.add('hidden');
    document.getElementById('compose-video-el').removeAttribute('src');
    document.getElementById('preview-btn').disabled = composeFiles.length === 0 && !document.getElementById('post-content').value.trim();
  }

  function renderComposeThumbs() {
    const box = document.getElementById('compose-thumbs');
    box.innerHTML = composeFiles.map((f, i) => `
      <div class="compose-thumb" draggable="true" data-idx="${i}">
        <img src="${URL.createObjectURL(f)}">
        <div class="rm" onclick="removeComposeFile(${i})"><i class="fa-solid fa-xmark"></i></div>
      </div>`).join('');
    document.getElementById('preview-btn').disabled = composeFiles.length === 0 && !document.getElementById('post-content').value.trim();
    let dragSrc = null;
    box.querySelectorAll('.compose-thumb').forEach(el => {
      el.addEventListener('dragstart', () => { dragSrc = +el.dataset.idx; });
      el.addEventListener('dragover', ev => { ev.preventDefault(); el.classList.add('drag-over'); });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', ev => {
        ev.preventDefault(); el.classList.remove('drag-over');
        const dst = +el.dataset.idx;
        if (dragSrc === null || dragSrc === dst) return;
        const moved = composeFiles.splice(dragSrc, 1)[0];
        composeFiles.splice(dst, 0, moved);
        renderComposeThumbs();
      });
    });
  }
  function removeComposeFile(i) { composeFiles.splice(i, 1); renderComposeThumbs(); }

  function gridClass(n) { return n === 1 ? 'g1' : n === 2 ? 'g2' : n === 3 ? 'g3' : 'g4'; }
  function imagesGridHtml(urls) {
    if (!urls.length) return '';
    const shown = urls.slice(0, 4);
    const extra = urls.length - 4;
    return `<div class="img-grid ${gridClass(shown.length)} mb-2">${shown.map((u, i) => `
      <div style="position:relative">
        <img src="${u}" onerror="this.onerror=null;this.src='assets/img/broken-image.svg'">
        ${i === 3 && extra > 0 ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.25rem">+${extra}</div>` : ''}
      </div>`).join('')}</div>`;
  }

  function openModal(id) { const el = document.getElementById(id); el.classList.remove('hidden'); el.classList.add('is-open'); }
  function closeModal(id) { const el = document.getElementById(id); el.classList.add('hidden'); el.classList.remove('is-open'); if (id === 'story-view-modal') clearInterval(storyTimer); }

  function openPreview() {
    const me = EduAPI.getUser();
    const content = document.getElementById('post-content').value.trim();
    const urls = composeFiles.map(f => URL.createObjectURL(f));
    const videoUrl = composeVideoFile ? URL.createObjectURL(composeVideoFile) : '';
    document.getElementById('preview-body').innerHTML = `
      <div class="flex items-center gap-3 mb-2">${avatarHtml(me)}<div><p class="font-bold text-sm flex items-center">${nameHtml(me)}</p><p class="text-[10px] text-slate-500">Vừa xong · ${document.getElementById('post-privacy').selectedOptions[0].text}</p></div></div>
      <p class="text-sm mb-2 whitespace-pre-wrap">${escapeHtml(content)}</p>
      ${imagesGridHtml(urls)}
      ${videoUrl ? `<video src="${videoUrl}" controls muted class="w-full max-h-80 rounded-2xl bg-black object-contain mb-2"></video>` : ''}
      ${!content && !urls.length && !videoUrl ? '<p class="text-slate-500 text-xs">Bài viết trống — hãy nhập nội dung hoặc thêm ảnh/video.</p>' : ''}
    `;
    openModal('post-preview-modal');
  }
  document.getElementById('post-content').addEventListener('input', () => {
    document.getElementById('preview-btn').disabled = composeFiles.length === 0 && !document.getElementById('post-content').value.trim();
  });

  async function loadFeed() {
    const { posts } = await EduAPI.request('/api/posts');
    const me = EduAPI.getUser();
    document.getElementById('feed').innerHTML = posts.map(p => {
      const imgs = (p.images && p.images.length ? p.images : (p.image ? [p.image] : [])).map(EduAPI.fileUrl);
      return `
      <div class="glass-panel p-4 rounded-3xl mb-4">
        <div class="flex items-center gap-3 mb-2">
          ${p.author ? `<a href="profile.html?id=${p.author.id}">${avatarHtml(p.author)}</a>` : ''}
          <div>
            <a href="profile.html?id=${p.author ? p.author.id : ''}" class="font-bold text-sm hover:underline flex items-center">${p.author ? nameHtml(p.author) : 'Ẩn danh'}</a>
            <p class="text-[10px] text-slate-500">${new Date(p.createdAt).toLocaleString('vi-VN')} · ${p.privacy === 'friends' ? '👥 Bạn bè' : p.privacy === 'private' ? '🔒 Chỉ mình tôi' : '🌐 Công khai'}</p>
          </div>
          ${(p.author && p.author.id === me.id) || me.role === 'admin' ? `<button onclick="deletePost('${p.id}')" class="ml-auto text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
        <p class="text-sm mb-2 whitespace-pre-wrap">${escapeHtml(p.content)}</p>
        ${imagesGridHtml(imgs)}
        ${p.video ? EduVideo.renderVideoBlock(EduAPI.fileUrl(p.video), { extraClass: 'max-h-[520px]' }) : ''}
        <div class="flex items-center gap-4 text-xs text-slate-400 border-t border-white/5 pt-2">
          <button onclick="likePost('${p.id}')" class="hover:text-pink-400"><i class="fa-solid fa-heart mr-1"></i>${p.likeCount} Thích</button>
          <span><i class="fa-solid fa-comment mr-1"></i>${p.commentCount} Bình luận</span>
        </div>
        <div class="mt-2 space-y-1">
          ${p.comments.slice(-3).map(c => `<p class="text-xs text-slate-300"><b>${c.authorId === me.id ? 'Bạn' : 'User'}:</b> ${escapeHtml(c.content)}</p>`).join('')}
        </div>
        <div class="flex gap-2 mt-2">
          <input class="input-field text-xs" placeholder="Viết bình luận..." onkeydown="if(event.key==='Enter')commentPost('${p.id}', this)">
        </div>
      </div>`;
    }).join('') || '<p class="text-slate-500 text-sm">Chưa có bài viết nào. Hãy là người đầu tiên chia sẻ!</p>';
    EduVideo.observeAll(document.getElementById('feed'));
  }

  async function createPost() {
    const content = document.getElementById('post-content').value.trim();
    if (!content && !composeFiles.length && !composeVideoFile) return;
    const fd = new FormData();
    fd.append('content', content);
    fd.append('privacy', document.getElementById('post-privacy').value);
    composeFiles.forEach(f => fd.append('images', f)); // order preserved = layout order
    if (composeVideoFile) fd.append('video', composeVideoFile);
    try {
      await EduAPI.request('/api/posts', { method: 'POST', body: fd, isForm: true });
      document.getElementById('post-content').value = '';
      composeFiles = []; renderComposeThumbs();
      removeComposeVideo();
      closeModal('post-preview-modal');
      loadFeed();
      EduAPI.toast('Đã đăng bài!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
  async function likePost(id) { await EduAPI.request(`/api/posts/${id}/like`, { method: 'POST' }); loadFeed(); }
  async function commentPost(id, input) {
    const content = input.value.trim(); if (!content) return;
    await EduAPI.request(`/api/posts/${id}/comments`, { method: 'POST', body: { content } });
    input.value = ''; loadFeed();
  }
  async function deletePost(id) { if (!confirm('Xoá bài viết này?')) return; await EduAPI.request(`/api/posts/${id}`, { method: 'DELETE' }); loadFeed(); }

  /* ---------------- Stories ---------------- */
  async function loadStories() {
    const { groups } = await EduAPI.request('/api/stories');
    storyGroups = groups;
    const me = EduAPI.getUser();
    const mine = groups.find(g => g.author && g.author.id === me.id);
    let html = `
      <div class="story-bubble" onclick="openModal('story-compose-modal')">
        <div class="relative">
          ${avatarHtml(me, 20)}
          <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-cyan-400 text-brand-950 flex items-center justify-center text-xs font-black border-2 border-brand-950"><i class="fa-solid fa-plus"></i></div>
        </div>
        <p class="text-[10px] text-center mt-1 font-bold truncate w-[88px]">Tạo tin</p>
      </div>`;
    html += groups.map((g, gi) => g.author ? `
      <div class="story-bubble" onclick="viewStory(${gi})">
        <div class="story-ring"><img src="${EduAPI.fileUrl(g.stories[0].image)}" class="story-thumb" onerror="this.onerror=null;this.src='assets/img/broken-image.svg'"></div>
        <p class="text-[10px] text-center mt-1 font-bold truncate w-[88px]">${g.author.id === me.id ? 'Tin của bạn' : (g.author.fullName || g.author.username)}</p>
      </div>` : '').join('');
    document.getElementById('stories-bar').innerHTML = html;
  }

  document.getElementById('story-image').addEventListener('change', e => {
    storyFile = e.target.files[0] || null;
    const img = document.getElementById('story-preview-img');
    if (storyFile) { img.src = URL.createObjectURL(storyFile); img.classList.remove('hidden'); }
  });
  async function submitStory() {
    if (!storyFile) { EduAPI.toast('Hãy chọn một ảnh.', 'error'); return; }
    const fd = new FormData();
    fd.append('image', storyFile);
    fd.append('caption', document.getElementById('story-caption').value.trim());
    try {
      await EduAPI.request('/api/stories', { method: 'POST', body: fd, isForm: true });
      storyFile = null;
      document.getElementById('story-image').value = '';
      document.getElementById('story-caption').value = '';
      document.getElementById('story-preview-img').classList.add('hidden');
      closeModal('story-compose-modal');
      loadStories();
      EduAPI.toast('Đã đăng tin! Tin sẽ tự ẩn sau 24 giờ.', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  function viewStory(gi) {
    storyGroupIdx = gi; storyIdx = 0;
    openModal('story-view-modal');
    renderStory();
  }
  function renderStory() {
    clearInterval(storyTimer);
    const group = storyGroups[storyGroupIdx];
    if (!group) { closeModal('story-view-modal'); return; }
    const story = group.stories[storyIdx];
    const me = EduAPI.getUser();
    document.getElementById('story-view-img').src = EduAPI.fileUrl(story.image);
    document.getElementById('story-view-name').textContent = group.author.fullName || group.author.username;
    document.getElementById('story-view-time').textContent = new Date(story.createdAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('story-view-caption').textContent = story.caption || '';
    document.getElementById('story-view-avatar').innerHTML = avatarHtml(group.author, 8);
    document.getElementById('story-delete-btn').classList.toggle('hidden', group.author.id !== me.id);
    document.getElementById('story-progress').innerHTML = group.stories.map((s, i) => `
      <div style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden">
        <div id="story-bar-${i}" style="height:100%;width:${i < storyIdx ? '100' : '0'}%;background:#fff"></div>
      </div>`).join('');
    if (story.id) EduAPI.request(`/api/stories/${story.id}/view`, { method: 'POST' }).catch(() => {});
    let pct = 0;
    const bar = document.getElementById(`story-bar-${storyIdx}`);
    storyTimer = setInterval(() => {
      pct += 2;
      if (bar) bar.style.width = pct + '%';
      if (pct >= 100) storyNav(1);
    }, 100);
  }
  function storyNav(dir) {
    const group = storyGroups[storyGroupIdx];
    storyIdx += dir;
    if (storyIdx < 0) { storyGroupIdx--; if (storyGroupIdx < 0) { closeModal('story-view-modal'); return; } storyIdx = storyGroups[storyGroupIdx].stories.length - 1; }
    else if (storyIdx >= group.stories.length) { storyGroupIdx++; storyIdx = 0; if (storyGroupIdx >= storyGroups.length) { closeModal('story-view-modal'); return; } }
    renderStory();
  }
  async function deleteCurrentStory() {
    const story = storyGroups[storyGroupIdx].stories[storyIdx];
    if (!confirm('Xoá tin này?')) return;
    await EduAPI.request(`/api/stories/${story.id}`, { method: 'DELETE' });
    closeModal('story-view-modal');
    loadStories();
  }

  /* ---------------- Friends sidebar + search (chat unchanged below) ---------------- */
  async function loadFriends() {
    const { friends } = await EduAPI.request('/api/friends');
    people = friends;
    document.getElementById('people-list').innerHTML = friends.map(u => `
      <div class="w-full flex items-center gap-2 p-2 rounded-xl hover:bg-white/5">
        <a href="profile.html?id=${u.id}">${avatarHtml(u, 8)}</a>
        <a href="profile.html?id=${u.id}" class="text-xs font-bold truncate flex-1 hover:underline flex items-center">${nameHtml(u)}</a>
        <button onclick='openChat(${JSON.stringify(u)})' class="text-cyan-400 text-xs" title="Nhắn tin"><i class="fa-solid fa-message"></i></button>
      </div>`).join('') || '<p class="text-xs text-slate-500">Chưa có bạn bè nào — tìm bạn mới ở ô phía trên.</p>';
  }

  let searchDebounce = null;
  function searchFriends(q) {
    clearTimeout(searchDebounce);
    const box = document.getElementById('friend-search-results');
    if (!q.trim()) { box.innerHTML = ''; return; }
    searchDebounce = setTimeout(async () => {
      const { users } = await EduAPI.request(`/api/friends/search?q=${encodeURIComponent(q)}`);
      box.innerHTML = users.map(u => `
        <div class="w-full flex items-center gap-2 p-2 rounded-xl bg-white/5">
          <a href="profile.html?id=${u.id}">${avatarHtml(u, 8)}</a>
          <a href="profile.html?id=${u.id}" class="text-xs font-bold truncate flex-1 hover:underline flex items-center">${nameHtml(u)}</a>
          ${u.isFriend ? '<span class="text-[10px] text-emerald-400">Bạn bè</span>' :
            u.requestSent ? '<span class="text-[10px] text-slate-500">Đã gửi</span>' :
            u.requestReceived ? `<button onclick="acceptFriendReq('${u.requestReceived}')" class="text-[10px] px-2 py-1 rounded-lg bg-cyan-500/20 text-cyan-300">Chấp nhận</button>` :
            `<button onclick="sendFriendReq('${u.id}', this)" class="text-[10px] px-2 py-1 rounded-lg bg-cyan-500/20 text-cyan-300"><i class="fa-solid fa-user-plus"></i></button>`}
        </div>`).join('') || '<p class="text-xs text-slate-500 p-2">Không tìm thấy ai phù hợp.</p>';
    }, 300);
  }
  async function sendFriendReq(id, btn) {
    try {
      await EduAPI.request('/api/friends/request', { method: 'POST', body: { toId: id } });
      btn.outerHTML = '<span class="text-[10px] text-slate-500">Đã gửi</span>';
      EduAPI.toast('Đã gửi lời mời kết bạn!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
  async function acceptFriendReq(reqId) {
    try {
      await EduAPI.request(`/api/friends/requests/${reqId}/accept`, { method: 'POST' });
      EduAPI.toast('Đã trở thành bạn bè!', 'success');
      loadFriends();
      searchFriends(document.getElementById('friend-search-input').value);
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  function toggleChat() {
    const panel = document.getElementById('chat-panel');
    panel.classList.toggle('hidden'); panel.classList.toggle('flex');
  }
  function connectChat() {
    ws = EduAPI.openChatSocket(msg => {
      if (msg.type === 'chat' && activePartner && (msg.message.fromId === activePartner.id || msg.message.toId === activePartner.id)) {
        appendChatMsg(msg.message);
      }
    });
  }
  async function openChat(partner) {
    activePartner = partner;
    document.getElementById('chat-title').textContent = partner.fullName || partner.username;
    const panel = document.getElementById('chat-panel');
    panel.classList.remove('hidden'); panel.classList.add('flex');
    const { messages } = await EduAPI.request(`/api/messages/${partner.id}`);
    document.getElementById('chat-messages').innerHTML = '';
    messages.forEach(appendChatMsg);
  }
  function appendChatMsg(m) {
    const me = EduAPI.getUser();
    const box = document.getElementById('chat-messages');
    const mine = m.fromId === me.id;
    box.innerHTML += `<div class="flex ${mine ? 'justify-end' : 'justify-start'}"><span class="px-3 py-2 rounded-2xl ${mine ? 'bg-cyan-500/20 text-cyan-100' : 'bg-white/10 text-slate-200'} max-w-[75%] break-words">${escapeHtml(m.content)}</span></div>`;
    box.scrollTop = box.scrollHeight;
  }
  function sendChat() {
    const input = document.getElementById('chat-input');
    const content = input.value.trim();
    if (!content || !activePartner) return;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'chat', toId: activePartner.id, content }));
    else EduAPI.request('/api/messages', { method: 'POST', body: { toId: activePartner.id, content } }).then(r => appendChatMsg(r.message));
    input.value = '';
  }
  document.addEventListener('keydown', e => { if (e.target.id === 'chat-input' && e.key === 'Enter') sendChat(); });
</script>
</body>
</html>

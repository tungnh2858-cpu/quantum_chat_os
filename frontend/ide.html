<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI IDE & Lập Trình - EduPulse</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-4 glass-panel p-4 rounded-3xl shadow-xl flex-wrap gap-3">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-code text-emerald-400 mr-2"></i>AI IDE & Lập Trình</h2>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <select id="lang-select" class="input-field w-40 text-xs"></select>
        <button onclick="runCode()" id="run-btn" class="btn-primary text-xs"><i class="fa-solid fa-play mr-1"></i>Chạy Code</button>
        <button onclick="explainCode()" class="btn-primary text-xs" style="background:linear-gradient(90deg,#ff007f,#7c3aed)"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Gợi Ý AI</button>
      </div>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-1 min-h-0">
      <div class="lg:col-span-2 glass-panel rounded-3xl overflow-hidden flex flex-col min-h-[420px]">
        <div id="monaco-editor" class="flex-1"></div>
      </div>
      <div class="flex flex-col gap-4">
        <div class="glass-panel rounded-3xl p-4 flex-1 min-h-[180px]">
          <h3 class="text-xs font-black text-slate-400 uppercase mb-2"><i class="fa-solid fa-terminal mr-1"></i>Kết Quả Chạy</h3>
          <pre id="output-box" class="text-xs font-mono text-emerald-300 whitespace-pre-wrap break-words">// Nhấn "Chạy Code" để xem kết quả...</pre>
        </div>
        <div class="glass-panel rounded-3xl p-4">
          <h3 class="text-xs font-black text-slate-400 uppercase mb-2"><i class="fa-solid fa-robot mr-1"></i>Gợi Ý AI</h3>
          <p id="ai-hint-box" class="text-xs text-slate-300 leading-relaxed">Viết code rồi bấm "Gợi Ý AI" để nhận nhận xét nhanh về cấu trúc, lỗi cú pháp phổ biến và mẹo tối ưu (phân tích tại chỗ, không cần kết nối AI ngoài).</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  if (!EduLayout.guard('ide')) { /* redirected */ }

  const SNIPPETS = {
    javascript: "console.log('Xin chào EduPulse!');",
    python: "print('Xin chào EduPulse!')",
    java: "public class Main {\n  public static void main(String[] args) {\n    System.out.println(\"Xin chào EduPulse!\");\n  }\n}",
    'c++': "#include <iostream>\nint main(){ std::cout << \"Xin chào EduPulse!\"; return 0; }",
    c: "#include <stdio.h>\nint main(){ printf(\"Xin chao EduPulse!\"); return 0; }",
    csharp: "using System;\nclass Program { static void Main() { Console.WriteLine(\"Xin chao EduPulse!\"); } }",
    go: "package main\nimport \"fmt\"\nfunc main(){ fmt.Println(\"Xin chao EduPulse!\") }",
    php: "<?php\necho \"Xin chao EduPulse!\";",
    ruby: "puts 'Xin chao EduPulse!'",
    rust: "fn main(){ println!(\"Xin chao EduPulse!\"); }",
    typescript: "const msg: string = 'Xin chao EduPulse!';\nconsole.log(msg);",
    kotlin: "fun main() { println(\"Xin chao EduPulse!\") }",
    swift: "print(\"Xin chao EduPulse!\")",
    dart: "void main(){ print('Xin chao EduPulse!'); }",
    bash: "echo 'Xin chao EduPulse!'"
  };

  let editor, runtimes = [];

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], async () => {
    editor = monaco.editor.create(document.getElementById('monaco-editor'), {
      value: SNIPPETS.javascript, language: 'javascript', theme: 'vs-dark',
      automaticLayout: true, fontSize: 14, minimap: { enabled: false }
    });
    await loadLanguages();
  });

  async function loadLanguages() {
    try {
      const { runtimes: rt } = await EduAPI.request('/api/ide/languages');
      runtimes = rt;
      const uniq = [...new Map(rt.map(r => [r.language, r])).values()];
      const sel = document.getElementById('lang-select');
      sel.innerHTML = uniq.map(r => `<option value="${r.language}">${r.language}</option>`).join('');
      sel.value = 'javascript';
      sel.addEventListener('change', onLangChange);
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }

  function monacoLangFor(lang) {
    const map = { 'c++': 'cpp', csharp: 'csharp', python: 'python', javascript: 'javascript', typescript: 'typescript', java: 'java', go: 'go', php: 'php', ruby: 'ruby', rust: 'rust', kotlin: 'kotlin', swift: 'swift', dart: 'dart', bash: 'shell', c: 'c' };
    return map[lang] || 'plaintext';
  }

  function onLangChange() {
    const lang = document.getElementById('lang-select').value;
    editor.setValue(SNIPPETS[lang] || `// ${lang}\n`);
    monaco.editor.setModelLanguage(editor.getModel(), monacoLangFor(lang));
  }

  async function runCode() {
    const lang = document.getElementById('lang-select').value;
    const version = (runtimes.find(r => r.language === lang) || {}).version || '*';
    const output = document.getElementById('output-box');
    output.textContent = 'Đang chạy...';
    try {
      const { result } = await EduAPI.request('/api/ide/execute', { method: 'POST', body: { language: lang, version, code: editor.getValue() } });
      const run = result.run || {};
      output.textContent = (run.stdout || '') + (run.stderr ? `\n[stderr]\n${run.stderr}` : '') || '(không có output)';
    } catch (err) {
      output.textContent = `Lỗi: ${err.message}`;
    }
  }

  function explainCode() {
    const code = editor.getValue();
    const lines = code.split('\n').length;
    const hints = [];
    if (!code.trim()) hints.push('Chưa có mã nguồn nào để phân tích.');
    if (/todo|fixme/i.test(code)) hints.push('Phát hiện TODO/FIXME — còn phần chưa hoàn thiện.');
    if (code.includes('console.log') || code.includes('print(')) hints.push('Có lệnh in ra màn hình — phù hợp để debug nhanh.');
    if (lines > 80) hints.push('File khá dài (' + lines + ' dòng) — cân nhắc tách hàm/module để dễ bảo trì.');
    if (!hints.length) hints.push('Cấu trúc mã nguồn ổn. Hãy chạy thử để kiểm tra kết quả!');
    document.getElementById('ai-hint-box').textContent = hints.join(' ');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bạn Bè — Quantum Chat OS</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<link rel="icon" type="image/svg+xml" href="assets/img/quantum-chat-logo.svg">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/tailwind.built.css?v=20260830">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css?v=20260830">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-user-group text-cyan-400 mr-2"></i>Bạn Bè</h2>
      </div>
      <div class="relative w-64 max-w-[45vw]">
        <input id="search-input" class="input-field text-xs !pl-8" placeholder="Tìm bạn mới..." oninput="doSearch(this.value)">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
      </div>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div id="search-section" class="hidden glass-panel p-4 rounded-3xl mb-6">
      <h3 class="text-xs font-black text-slate-400 uppercase mb-3">Kết quả tìm kiếm</h3>
      <div id="search-results" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>

    <div id="requests-section" class="glass-panel p-4 rounded-3xl mb-6">
      <h3 class="text-xs font-black text-slate-400 uppercase mb-3"><i class="fa-solid fa-user-clock text-amber-400 mr-1"></i>Lời mời kết bạn</h3>
      <div id="requests-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>

    <div class="glass-panel p-4 rounded-3xl">
      <h3 class="text-xs font-black text-slate-400 uppercase mb-3"><i class="fa-solid fa-users text-cyan-400 mr-1"></i>Tất cả bạn bè</h3>
      <div id="friends-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>
  </main>
</div>

<script src="assets/js/particles.js?v=20260830"></script>
<script src="assets/js/config.js?v=20260830"></script>
<script src="assets/js/cursor.js?v=20260830"></script>
<script src="assets/js/api.js?v=20260830"></script>
<script src="assets/js/layout.js?v=20260830"></script>
<script>
  if (EduLayout.guard('friends')) { loadFriends(); loadRequests(); }

  function avatarHtml(u, size = 11) {
    const initials = (u.fullName || u.username || '?').trim().split(/\s+/).slice(-2).map(s => s[0]).join('').toUpperCase();
    return u.avatar ? `<img src="${EduAPI.fileUrl(u.avatar)}" class="w-${size} h-${size} rounded-full object-cover" onerror="this.onerror=null;this.src=&quot;assets/img/broken-image.svg&quot;;this.classList.add(&quot;opacity-40&quot;)">` : `<div class="avatar-initial w-${size} h-${size} text-sm">${initials}</div>`;
  }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function nameHtml(u) { return `${escapeHtml(u.fullName || u.username)}${EduLayout.verifiedBadge(u)}`; }

  async function loadFriends() {
    const { friends } = await EduAPI.request('/api/friends');
    document.getElementById('friends-list').innerHTML = friends.map(u => `
      <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/5">
        <a href="profile.html?id=${u.id}">${avatarHtml(u)}</a>
        <a href="profile.html?id=${u.id}" class="text-sm font-bold flex-1 hover:underline flex items-center">${nameHtml(u)}</a>
        <a href="messages.html?with=${u.id}" class="text-[10px] px-2 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300" title="Nhắn tin"><i class="fa-solid fa-message"></i></a>
        <button onclick="unfriend('${u.id}')" class="text-[10px] px-2 py-1.5 rounded-lg bg-white/5 hover:bg-rose-500/20 hover:text-rose-300 text-slate-400">Huỷ kết bạn</button>
      </div>`).join('') || '<p class="text-xs text-slate-500 col-span-full">Bạn chưa có người bạn nào. Hãy tìm kiếm để kết bạn!</p>';
  }
  async function unfriend(id) {
    if (!confirm('Huỷ kết bạn với người này?')) return;
    await EduAPI.request(`/api/friends/${id}`, { method: 'DELETE' });
    loadFriends();
  }

  async function loadRequests() {
    const { requests } = await EduAPI.request('/api/friends/requests');
    const section = document.getElementById('requests-section');
    section.classList.toggle('hidden', requests.length === 0);
    document.getElementById('requests-list').innerHTML = requests.map(r => `
      <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/5">
        <a href="profile.html?id=${r.from.id}">${avatarHtml(r.from)}</a>
        <a href="profile.html?id=${r.from.id}" class="text-sm font-bold flex-1 hover:underline flex items-center">${nameHtml(r.from)}</a>
        <button onclick="respondRequest('${r.id}', 'accept')" class="text-[10px] px-2 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300">Chấp nhận</button>
        <button onclick="respondRequest('${r.id}', 'reject')" class="text-[10px] px-2 py-1.5 rounded-lg bg-white/5 text-slate-400">Từ chối</button>
      </div>`).join('');
  }
  async function respondRequest(id, action) {
    await EduAPI.request(`/api/friends/requests/${id}/${action}`, { method: 'POST' });
    loadRequests(); loadFriends();
  }

  let searchDebounce = null;
  function doSearch(q) {
    clearTimeout(searchDebounce);
    const section = document.getElementById('search-section');
    if (!q.trim()) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    searchDebounce = setTimeout(async () => {
      const { users } = await EduAPI.request(`/api/friends/search?q=${encodeURIComponent(q)}`);
      document.getElementById('search-results').innerHTML = users.map(u => `
        <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/5">
          <a href="profile.html?id=${u.id}">${avatarHtml(u)}</a>
          <a href="profile.html?id=${u.id}" class="text-sm font-bold flex-1 hover:underline flex items-center">${nameHtml(u)}</a>
          ${u.isFriend ? '<span class="text-[10px] text-emerald-400">Bạn bè</span>' :
            u.requestSent ? '<span class="text-[10px] text-slate-500">Đã gửi</span>' :
            u.requestReceived ? `<button onclick="respondRequest('${u.requestReceived}','accept')" class="text-[10px] px-2 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300">Chấp nhận</button>` :
            `<button onclick="addFriend('${u.id}', this)" class="text-[10px] px-2 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300"><i class="fa-solid fa-user-plus mr-1"></i>Kết bạn</button>`}
        </div>`).join('') || '<p class="text-xs text-slate-500 col-span-full">Không tìm thấy ai phù hợp.</p>';
    }, 300);
  }
  async function addFriend(id, btn) {
    try {
      await EduAPI.request('/api/friends/request', { method: 'POST', body: { toId: id } });
      btn.outerHTML = '<span class="text-[10px] text-slate-500">Đã gửi</span>';
      EduAPI.toast('Đã gửi lời mời kết bạn!', 'success');
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
</script>
</body>
</html>
